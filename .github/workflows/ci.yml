name: Startup record contract
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  startup-records:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APACK_CHAIN_CORES: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0e63e75b63a460da52ec109da731e3ff7b38eb9d
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - uses: ./.github/actions/elmdb
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 41210208958
          name: strict-producers-0e63e75b63a460da52ec109da731e3ff7b38eb9d
          path: ${{ runner.temp }}/producer-outputs
      - name: Admit existing producer outputs and build the app
        shell: bash
        run: |
          tar -xzf "$RUNNER_TEMP/producer-outputs/producers.tgz"
          npm run chain -- --only packages:ensure,build:runtime --no-native --cores 2
      - name: Verify canonical startup records through actual worker exits
        shell: bash
        env:
          APACK_PERFORMANCE_MODE: lightweight
          APACK_PERFORMANCE_TRIALS: '1'
          APACK_PERFORMANCE_RUN_OUTPUT: .apack/performance/startup-record-contract
        run: |
          set -o pipefail
          node scripts/with-source.mjs tsx tests/performance/startup-run.ts 2>&1 | tee "$RUNNER_TEMP/startup-record-contract.log"
          node scripts/with-source.mjs tsx tests/performance/verify-run.ts "$APACK_PERFORMANCE_RUN_OUTPUT" "" 1
          node --input-type=module <<'VERIFY'
          import { readFileSync, existsSync } from 'node:fs';
          const root = process.env.APACK_PERFORMANCE_RUN_OUTPUT;
          const index = JSON.parse(readFileSync(`${root}/results.json`));
          if (index.records.length !== 6 || index.invocations.length !== 7) throw Error('Missing warmup, measured worker or seed exit');
          for (const [position, record] of index.records.entries()) {
            if (record.file !== `trial-${position}/trial.json` || existsSync(`${root}/trial-${position}.json`)) throw Error('Startup raw record was duplicated');
          }
          console.log('Canonical startup record contract passed; this one-measurement run does not qualify overhead.');
          VERIFY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-record-contract-0e63e75b63
          include-hidden-files: true
          retention-days: 2
          path: |
            ${{ runner.temp }}/startup-record-contract.log
            .apack/performance/startup-record-contract/
            node_modules/.cache/apack-chain/runs/

name: Performance cleanup contracts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a075fe1c418e6e71e5666c18e38f1a8f9727e09f
      - name: Fetch the pinned native source
        shell: bash
        run: |
          rev=$(tr -d '[:space:]' < vendor/elmdb.rev)
          git init -q vendor/elmdb
          git -C vendor/elmdb fetch -q --depth 1 https://github.com/spankyed/elmdb.git "$rev"
          git -C vendor/elmdb checkout -q FETCH_HEAD
          git rev-parse HEAD
          git -C vendor/elmdb rev-parse HEAD
      - name: Build the maintained Linux image
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' vendor/elmdb/rust-toolchain.toml)
          test -n "$toolchain"
          docker build --build-arg RUST_TOOLCHAIN="$toolchain" -t apack-performance-contracts -f scripts/linux/Dockerfile scripts/linux
      - name: Validate application contracts in the bounded container
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          docker run --rm --init --memory=6g --memory-swap=6g --cpus=2 \
            -v "$GITHUB_WORKSPACE:/work" -e GITHUB_TOKEN apack-performance-contracts bash -ec '
              cd /work/vendor/elmdb
              npm ci --no-audit --no-fund
              npm run build
              cd /work
              npm ci --no-audit --no-fund
              npm run chain -- --only packages:ensure,build:default-setup --no-native --cores 1
              npm run chain -- --only build:runtime --no-native --cores 1
              cat > tests/performance/startup-diagnostic.config.ts <<"CONFIG"
          import base from "./playwright.config.ts";
          export default { ...base, testMatch: "startup-diagnostic.spec.ts", outputDir: ".apack/performance/startup-probe" };
          CONFIG
              cat > tests/performance/startup-diagnostic.spec.ts <<"PROBE"
          import { test } from "@apackdev/testing";
          import { waitForApplicationWindow } from "../../packages/apack-testing/src/application-window.ts";
          test("inspect renderer startup", async ({ electronApp }) => {
            const pages = new Set<import("@playwright/test").Page>();
            const observe = (page: import("@playwright/test").Page) => {
              if (pages.has(page)) return;
              pages.add(page);
              page.on("pageerror", error => console.log("[startup pageerror]", error.stack));
              page.on("console", message => console.log("[startup console]", message.type(), message.text()));
              page.on("requestfailed", request => console.log("[startup requestfailed]", request.url(), request.failure()));
              page.on("response", response => { if (response.status() >= 400) console.log("[startup response]", response.status(), response.url()); });
            };
            electronApp.on("window", observe);
            electronApp.windows().forEach(observe);
            try { await waitForApplicationWindow(electronApp, 45_000); }
            finally {
              for (const page of pages) {
                console.log("[startup document]", page.url(), await page.evaluate(() => ({
                  state: document.readyState, title: document.title,
                  scripts: [...document.scripts].map(script => ({ src: script.src, type: script.type })),
                  html: document.documentElement.outerHTML.slice(0, 4000),
                  resources: performance.getEntriesByType("resource").map(entry => ({ name: entry.name, duration: entry.duration })),
                })).catch(error => ({ error: String(error) })));
              }
            }
          });
          PROBE
              DEBUG_E2E=1 ELECTRON_ENABLE_LOGGING=1 xvfb-run -a npm run test:e2e -- --config tests/performance/startup-diagnostic.config.ts
            ' 2>&1 | tee "$RUNNER_TEMP/performance-contracts.log"
      - name: Make container-owned diagnostic evidence readable
        if: always()
        shell: bash
        run: |
          for output in .apack/performance node_modules/.cache/apack-chain/runs; do
            if [ -d "$output" ]; then sudo chown -R "$(id -u):$(id -g)" "$output"; fi
          done
      - name: Preserve contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-renderer-startup-probe-a075fe1c41
          include-hidden-files: true
          retention-days: 2
          path: |
            ${{ runner.temp }}/performance-contracts.log
            .apack/performance/
            node_modules/.cache/apack-chain/runs/

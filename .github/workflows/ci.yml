name: Linux application startup contract
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9a0f431c8f56982806802c502a1f127b44e47f23
      - name: Fetch the exact native pin
        shell: bash
        run: |
          rev=$(tr -d '[:space:]' < vendor/elmdb.rev)
          git init -q vendor/elmdb
          git -C vendor/elmdb fetch -q --depth 1 https://github.com/spankyed/elmdb.git "$rev"
          git -C vendor/elmdb checkout -q FETCH_HEAD
      - name: Build maintained Linux image
        shell: bash
        run: |
          toolchain=$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' vendor/elmdb/rust-toolchain.toml)
          test -n "$toolchain"
          docker build --build-arg RUST_TOOLCHAIN="$toolchain" -t apack-startup-contract -f scripts/linux/Dockerfile scripts/linux
      - name: Verify real application readiness and canonical startup reports
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          docker run --rm --init --memory=6g --memory-swap=6g --cpus=2 \
            -v "$GITHUB_WORKSPACE:/work" -e GITHUB_TOKEN apack-startup-contract bash -ec '
              cd /work/vendor/elmdb
              npm ci --no-audit --no-fund
              npm run build
              cd /work
              npm ci --no-audit --no-fund
              npm run chain -- --only packages:ensure,build:default-setup,build:runtime --no-native --cores 2
            ' 2>&1 | tee "$RUNNER_TEMP/linux-startup-build.log"
          # Both probes use these exact output bytes; only shared-memory capacity changes.
          for capacity in 64m 256m; do
            status=0
            docker run --rm --init --memory=6g --memory-swap=6g --cpus=2 --shm-size="$capacity" \
              -v "$GITHUB_WORKSPACE:/work" -e CAPACITY="$capacity" apack-startup-contract bash -ec '
                cd /work
                df -h /dev/shm
                export DEBUG_E2E=1 ELECTRON_ENABLE_LOGGING=1
                export E2E_DATA_DIR="/work/.apack/performance/profile-$CAPACITY"
                export APACK_PERFORMANCE_SCENARIO=thread-open APACK_PERFORMANCE_MODE=lightweight APACK_PERFORMANCE_TRIALS=1
                export APACK_PERFORMANCE_RUN_OUTPUT="/work/.apack/performance/linux-startup-$CAPACITY"
                xvfb-run -a node scripts/with-source.mjs playwright test --config tests/performance/playwright.config.ts
              ' 2>&1 | tee "$RUNNER_TEMP/linux-startup-$capacity.log" || status=$?
            echo "$status" > "$RUNNER_TEMP/linux-startup-$capacity.exit"
          done
          test "$(cat "$RUNNER_TEMP/linux-startup-256m.exit")" = 0
          docker run --rm --init --memory=6g --memory-swap=6g --cpus=2 --shm-size=256m \
            -v "$GITHUB_WORKSPACE:/work" apack-startup-contract bash -ec '
              cd /work
              APACK_PERFORMANCE_MODE=lightweight APACK_PERFORMANCE_TRIALS=1 APACK_PERFORMANCE_RUN_OUTPUT=/work/.apack/performance/linux-startup-records xvfb-run -a node scripts/with-source.mjs tsx tests/performance/startup-run.ts
              node scripts/with-source.mjs tsx tests/performance/verify-run.ts /work/.apack/performance/linux-startup-records "" 1
            ' 2>&1 | tee "$RUNNER_TEMP/linux-startup-records.log"
      - name: Make owned evidence readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .apack node_modules/.cache/apack-chain/runs 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-startup-contract-9a0f431c8f
          include-hidden-files: true
          retention-days: 2
          path: |
            ${{ runner.temp }}/linux-startup-*.log
            ${{ runner.temp }}/linux-startup-*.exit
            .apack/performance/
            node_modules/.cache/apack-chain/runs/
            packages/renderer/dist/

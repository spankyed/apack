name: Compiler Linux

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: Optional shared native integration test name pattern (skips other acceptance stages)
        type: string
        default: ''
  workflow_call:
    inputs:
      test_name:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: compiler-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compiler:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APACK_CHAIN_CORES: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record platform and compiler
        run: |
          git rev-parse HEAD
          uname -a
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})'
          test -f "$(dirname "$(command -v node)")/../include/node/node_api.h"
          cc --version
      - uses: ./.github/actions/elmdb
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Build matching packages
        run: npm run packages:ensure
      - name: Native metadata and admission checks
        if: ${{ !inputs.test_name }}
        run: >-
          node node_modules/vitest/vitest.mjs run --project @apackdev/cli
          packages/apack-cli/tests/build/compiler-elf-libraries.spec.ts
          packages/apack-cli/tests/build/compiler-elf-cache.spec.ts
          packages/apack-cli/tests/build/compiler-elf-environment.spec.ts
          packages/apack-cli/tests/build/compiler-native-libraries.spec.ts
          --bail=1 --poolOptions.threads.maxThreads=1 --poolOptions.threads.minThreads=1
      - name: Native ownership and outside-library admission
        if: ${{ !inputs.test_name }}
        run: >-
          node node_modules/vitest/vitest.mjs run --config vitest.native.config.ts --project @apackdev/cli
          packages/apack-cli/tests/build/compiler-elf-libraries.native.spec.ts
          --bail=1 --poolOptions.threads.maxThreads=1 --poolOptions.threads.minThreads=1 --no-file-parallelism
      - name: Compiler cancellation and descendant ownership
        if: ${{ !inputs.test_name }}
        run: >-
          node node_modules/vitest/vitest.mjs run --project @apackdev/cli
          packages/apack-cli/tests/build/pack-builder.spec.ts
          --testNamePattern='drains an interrupted frontend startup|cancels a frontend input check|stops its worker before removing|stops remaining compiler descendants|force-stops a compiler'
          --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/compiler-cancellation.json"
          --bail=1 --poolOptions.threads.maxThreads=1 --poolOptions.threads.minThreads=1
      - name: Native backend publication, compiler threads and launch search paths
        env:
          APACK_TEST_NAME: ${{ inputs.test_name || 'captures native .* libraries and retains the incumbent|retains launch-time native search paths' }}
        run: >-
          node node_modules/vitest/vitest.mjs run --config vitest.native.config.ts --project @apackdev/cli
          packages/apack-cli/tests/build/compiler-native-runtime.native.spec.ts
          packages/apack-cli/tests/build/compiler-native-vite.native.spec.ts
          packages/apack-cli/tests/build/compiler-native-libraries.native.spec.ts
          packages/apack-cli/tests/build/compiler-native-launch.native.spec.ts
          --testNamePattern "$APACK_TEST_NAME"
          --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/compiler-native-publication.json"
          --bail=1 --poolOptions.threads.maxThreads=1 --poolOptions.threads.minThreads=1 --no-file-parallelism
      - name: Retained Vite process ownership
        if: ${{ !inputs.test_name }}
        run: >-
          node node_modules/vitest/vitest.mjs run --config vitest.native.config.ts --project @apackdev/cli
          packages/apack-cli/tests/build/compiler-native-vite.native.spec.ts
          --testNamePattern='retains independent captured Vite owners'
          --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/compiler-vite-ownership.json"
          --bail=1 --poolOptions.threads.maxThreads=1 --poolOptions.threads.minThreads=1 --no-file-parallelism
      - name: Build worker platform baseline
        if: ${{ !inputs.test_name }}
        run: >-
          node node_modules/vitest/vitest.mjs run --config vitest.native.config.ts --project @apackdev/cli
          packages/apack-cli/tests/build/build-worker.native.spec.ts
          --testNamePattern='captures native launch identity|uses the captured compiler'
          --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/compiler-worker-baseline.json"
          --bail=1 --poolOptions.threads.maxThreads=1 --poolOptions.threads.minThreads=1 --no-file-parallelism
      - name: Verify selected compiler cases executed
        run: >-
          node .github/scripts/verify-filtered-tests.cjs
          ${{ inputs.test_name && 'compiler-native-publication'
            || 'compiler-cancellation compiler-native-publication compiler-vite-ownership compiler-worker-baseline' }}

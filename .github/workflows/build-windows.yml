name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.1.0). Leave empty to use package.json version.'
        required: false
        type: string
      channel:
        description: 'Build channel (production or beta)'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - beta

concurrency:
  group: release-win-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - uses: ./.github/actions/elmdb

      - name: Detect channel
        id: channel
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" == *-beta* ]] || [[ "${{ inputs.channel }}" == "beta" ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            echo "product_name=apack Beta" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            echo "product_name=apack" >> "$GITHUB_OUTPUT"
          fi
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${{ steps.channel.outputs.tag_version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Build and package
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          BETA_FLAG=""
          if [ "${{ steps.channel.outputs.is_beta }}" = "true" ]; then
            BETA_FLAG="-- --beta"
          fi
          npm run build:production $BETA_FLAG

      - name: Upload release files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_NAME="${{ steps.channel.outputs.product_name }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.channel.outputs.is_beta }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Wait briefly for the macOS workflow to create the release
          sleep 30
          assets=(dist/${APP_NAME}-*.exe)

          # Upload to existing release, or create if mac workflow hasn't yet
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              --title "${APP_NAME} $GITHUB_REF_NAME" \
              $PRERELEASE_FLAG \
              "${assets[@]}" || {
                status=$?
                if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                  gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
                else
                  exit "$status"
                fi
              }
          fi

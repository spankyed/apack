name: Build Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel (production or beta)'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - beta

concurrency:
  group: release-win-${{ github.ref }}
  cancel-in-progress: true

# What builds reads the repository and nothing more. The one job whose token writes is the release job, which runs
# gh over the files the build job kept and no code from the checkout or its dependencies
permissions:
  contents: read

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      is_beta: ${{ steps.channel.outputs.is_beta }}
      product_name: ${{ steps.channel.outputs.product_name }}
      release_prefix: ${{ steps.channel.outputs.release_prefix }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install pinned npm
        run: npm install -g npm@11.21.1

      - uses: ./.github/actions/elmdb
      - uses: ./.github/actions/apack-terminal
      - uses: ./.github/actions/apack-git

      # A tag names its channel, and the `channel` input is read for a branch alone: a tag's files go into its
      # release, where a beta build dispatched on a production tag would put apack Beta's files
      - name: Detect channel
        id: channel
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CHANNEL=production
            if [[ "$TAG_VERSION" == *-beta* ]]; then CHANNEL=beta; fi
          fi
          if [ "$CHANNEL" = beta ]; then
            printf '%s\n' is_beta=true 'product_name=apack Beta' release_prefix=apack-Beta >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' is_beta=false product_name=apack release_prefix=apack >> "$GITHUB_OUTPUT"
          fi
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${{ steps.channel.outputs.tag_version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          # release.sh tags v<version>-beta.0 on a production release that had no beta
          # (beta-before-production rule); that tag builds the same version as apack Beta
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] && [ "$TAG_VERSION" != "${PKG_VERSION}-beta.0" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      # The install runs every dependency's install script, so it is a step of its own that holds no signing secret.
      # @vscode/ripgrep's postinstall reads the GitHub API, where a shared runner address without a token is over the
      # rate limit; this job's token reads this repository and writes nothing
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Build and package
        shell: bash
        env:
          APACK_DEPENDENCIES_INSTALLED: '1'
        run: |
          args=()
          if [ "${{ steps.channel.outputs.is_beta }}" = "true" ]; then
            args=(-- --beta)
          fi
          npm run build:production "${args[@]}"

      # One `<file>.sha256` beside each download, in the form `shasum` writes and the CLI's `downloadVerified` reads
      - name: Checksums
        shell: bash
        working-directory: dist
        run: |
          for file in "${{ steps.channel.outputs.release_prefix }}"-*.exe; do
            printf '%s  %s\n' "$(sha256sum "$file" | cut -d ' ' -f 1)" "$file" > "$file.sha256"
          done

      # What the release job uploads on a tag, and what a dispatch leaves for whoever dispatched it
      - name: Keep the release files
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ steps.channel.outputs.release_prefix }}
          path: |
            dist/${{ steps.channel.outputs.release_prefix }}-*.exe
            dist/${{ steps.channel.outputs.release_prefix }}-*.sha256
            dist/${{ steps.channel.outputs.release_prefix }}-*.cdx.json
          if-no-files-found: error
          compression-level: 0

  # The one job whose token writes. It runs for a dispatch from a branch too, where it stops after reading the files
  # the build kept, so the hand-over between the two jobs is exercised without a tag
  release:
    needs: build-win
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      APP_NAME: ${{ needs.build-win.outputs.product_name }}
      PREFIX: ${{ needs.build-win.outputs.release_prefix }}
      IS_BETA: ${{ needs.build-win.outputs.is_beta }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-${{ needs.build-win.outputs.release_prefix }}
          path: dist

      - name: The files to release
        run: |
          ls -l dist
          cd dist
          shasum -a 256 -c "${PREFIX}"-*.sha256

      - name: Upload release files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_BETA" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # The release prefix, which names the files (electron-builder.mjs), not the product name, which has a space
          assets=(dist/"${PREFIX}"-*.exe dist/"${PREFIX}"-*.sha256 dist/"${PREFIX}"-*.cdx.json)

          # A release that can't be read is not one that isn't there: only gh's `release not found` counts as none, since
          # creating one beside a release that exists would make a second draft for the tag, holding this platform's files
          release_exists() {
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2> view.err; then return 0; fi
            if grep -q 'release not found' view.err; then return 1; fi
            cat view.err
            exit 1
          }
          # Upload to the tag's release, or create it as a draft: build-mac.yml publishes it once the macOS files, which
          # `apack install` and `upgrade` read, are on it, so the release never shows without them
          if release_exists; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --draft \
              --generate-notes \
              --title "${APP_NAME} $GITHUB_REF_NAME" \
              $PRERELEASE_FLAG \
              "${assets[@]}" || {
                status=$?
                if release_exists; then
                  gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
                else
                  exit "$status"
                fi
              }
          fi

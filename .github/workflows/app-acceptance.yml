name: App acceptance

on:
  workflow_dispatch:
    inputs:
      suite:
        description: App acceptance suite; all also exercises the source CLI
        type: choice
        options: [all, app, external, bundled-ui, host-windows, sqlite, sqlite-api, cli, build, integration, packaged, installed, installed-signed, installed-platform, activation-profile, windows-durability]
        default: all
      storage_format:
        description: Storage for isolated source app/pack qualification; installed suites select SQLite explicitly
        type: choice
        options: [elmdb/1, sqlite/1]
        default: elmdb/1
      test:
        description: Playwright name pattern; integration requires space-separated integration or native spec file paths
        type: string
        default: ''
      repeat_each:
        description: Repeat each selected app or pack Playwright case (1-20)
        type: number
        default: 1
  workflow_call:
    inputs:
      suite:
        type: string
        default: all
      storage_format:
        type: string
        default: elmdb/1
      test:
        type: string
        default: ''
      repeat_each:
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: app-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sqlite:
    if: ${{ inputs.suite == 'sqlite' }}
    uses: ./.github/workflows/ears-sqlite.yml
  activation-profile:
    if: ${{ inputs.suite == 'activation-profile' }}
    uses: ./.github/workflows/ears-activation-profile.yml
  windows-durability:
    if: ${{ inputs.suite == 'windows-durability' }}
    uses: ./.github/workflows/ears-windows-durability.yml
  installed-platform:
    if: ${{ inputs.suite == 'installed-platform' }}
    uses: ./.github/workflows/ears-installed-platform.yml
  sqlite-api:
    if: ${{ inputs.suite == 'sqlite-api' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APACK_CHAIN_CORES: 2
      CARGO_BUILD_JOBS: 2
      npm_config_jobs: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-runtime
        with:
          node-version: 23.11.1
      - uses: ./.github/actions/elmdb
      - name: Install matching dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Regenerate EARS API from matching published packages
        run: |
          set -o pipefail
          mkdir -p .temp/sqlite-api
          git rev-parse HEAD > .temp/sqlite-api/source.txt
          cp vendor/elmdb.rev .temp/sqlite-api/elmdb.rev
          npm run packages:build 2>&1 | tee .temp/sqlite-api/packages.log
          npm run api:update -w @apackdev/ears 2>&1 | tee .temp/sqlite-api/update.log
          npm run api:check -w @apackdev/ears 2>&1 | tee .temp/sqlite-api/check.log
          git diff -- packages/apack-ears/etc > .temp/sqlite-api/reports.patch
      - name: Preserve generated reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ears-sqlite-api-${{ github.run_id }}
          path: |
            .temp/sqlite-api
            packages/apack-ears/etc
          if-no-files-found: error
          retention-days: 14
  check:
    if: ${{ inputs.suite != 'sqlite' && inputs.suite != 'sqlite-api' && inputs.suite != 'activation-profile' && inputs.suite != 'windows-durability' && inputs.suite != 'installed-platform' }}
    runs-on: ${{ inputs.suite == 'host-windows' && 'windows-latest' || 'macos-26' }}
    # Includes the cold builds, fork producer, app suites and bounded source-dev scenario.
    timeout-minutes: 45
    env:
      APACK_CHAIN_CORES: 2
      APACK_E2E_REPEAT: ${{ inputs.repeat_each }}
      APACK_STORAGE_FORMAT: ${{ inputs.storage_format || 'elmdb/1' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source
        run: git rev-parse HEAD
      - name: Validate storage selection
        run: |
          case "$APACK_STORAGE_FORMAT" in
            elmdb/1|sqlite/1) printf 'Isolated app storage: %s\n' "$APACK_STORAGE_FORMAT" ;;
            *) echo 'Expected elmdb/1 or sqlite/1'; exit 1 ;;
          esac
      - name: Validate repetition count
        run: |
          repeat_pattern='^([1-9]|1[0-9]|20)$'
          if [[ ! "$APACK_E2E_REPEAT" =~ $repeat_pattern ]]; then
            echo 'repeat_each must be an integer from 1 to 20'; exit 1
          fi
      - uses: ./.github/actions/elmdb
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Build shipped pack
        if: ${{ inputs.suite != 'host-windows' && !startsWith(inputs.suite, 'installed') }}
        env:
          APACK_ACCEPTANCE_SUITE: ${{ inputs.suite }}
        run: |
          if [[ "$APACK_ACCEPTANCE_SUITE" == 'build' ]]; then
            # Diagnostic only: observe build phase costs without running the application suites.
            mkdir -p .apack/tests/results
            node_modules/.bin/tsx scripts/bounded.ts scenario npm run build:default-setup | tee .apack/tests/results/default-build.log
          else
            npm run build:default-setup
          fi
      - name: Build app runtime
        if: ${{ inputs.suite != 'build' && inputs.suite != 'integration' && inputs.suite != 'host-windows' && !startsWith(inputs.suite, 'installed') }}
        id: runtime
        # The renderer leg's heap ceiling is declared on the leg (RUNTIME_BUILD_LEGS).
        run: npm run build:runtime -- --cores 2
      - name: Build unsigned installed Preview
        if: ${{ startsWith(inputs.suite, 'installed') }}
        run: |
          mkdir -p .apack/installed-evidence
          version="$(node -p 'require("./package.json").version.split("-")[0]')"
          npm run build:preview -- --version "$version" | tee .apack/installed-evidence/installed-build.log
      - name: Typecheck installed app contracts
        if: ${{ startsWith(inputs.suite, 'installed') }}
        run: node node_modules/typescript/bin/tsc -p tests --noEmit | tee .apack/installed-evidence/typecheck.log
      - name: Packaged native runtime
        if: ${{ startsWith(inputs.suite, 'installed') }}
        run: |
          apps=(dist/preview/mac-*/*.app/Contents/Resources/app)
          if (( ${#apps[@]} != 1 )) || [[ ! -d "${apps[0]}" ]]; then
            echo 'Expected one unpacked Preview app'; exit 1
          fi
          node build/prod/smoke-native.mjs "${apps[0]}" | tee .apack/installed-evidence/installed-native.log
      - name: Sign installed Preview and verify native provenance
        if: ${{ inputs.suite == 'installed-signed' }}
        env:
          APACK_TEST_CERTIFICATE: ${{ secrets.certificate || secrets.MAC_CERTIFICATE_P12_BASE64 }}
          APACK_TEST_CERTIFICATE_PASSWORD: ${{ secrets.certificate_password || secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$APACK_TEST_CERTIFICATE"
          umask 077
          keychain="$RUNNER_TEMP/apack-installed-signing.keychain-db"
          certificate="$RUNNER_TEMP/apack-installed-signing.p12"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APACK_TEST_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$APACK_TEST_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          export APACK_TEST_SIGNING_KEYCHAIN="$keychain"
          node --input-type=module <<'JS' | tee .apack/installed-evidence/installed-signing.log
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { signMacApplication } from './scripts/lib/native-signing.mjs';
          const apps=fs.readdirSync('dist/preview',{withFileTypes:true}).filter(d=>d.isDirectory()&&d.name.startsWith('mac-'))
            .flatMap(d=>fs.readdirSync(path.join('dist/preview',d.name)).filter(n=>n.endsWith('.app')).map(n=>path.resolve('dist/preview',d.name,n)));
          assert.equal(apps.length,1);
          const app=apps[0],keychain=process.env.APACK_TEST_SIGNING_KEYCHAIN;
          const search=execFileSync('security',['list-keychains','-d','user'],{encoding:'utf8'})
            .trim().split('\n').map(n=>n.trim().replace(/^"|"$/g,'')).filter(Boolean);
          execFileSync('security',['list-keychains','-d','user','-s',keychain,...search]);
          const identities=execFileSync('security',['find-identity','-v','-p','codesigning',keychain],{encoding:'utf8'});
          const matches=[...identities.matchAll(/\b([A-F0-9]{40}) "Developer ID Application:[^"\n]+"/g)];
          assert.equal(matches.length,1,'Expected one Developer ID Application identity');
          const entitlements=path.resolve('build/resources/entitlements.mac.plist');
          await signMacApplication({app,identity:matches[0][1],identityValidation:false,keychain,platform:'darwin',
            strictVerify:true,preAutoEntitlements:false,preEmbedProvisioningProfile:false,
            optionsForFile:()=>({entitlements,hardenedRuntime:true,timestamp:'none'})});
          execFileSync('codesign',['--verify','--deep','--strict',app],{stdio:'inherit'});
          const executable=path.join(app,'Contents/MacOS',fs.readdirSync(path.join(app,'Contents/MacOS'))[0]);
          const details=spawnSync('codesign',['--display','--verbose=4',executable],{encoding:'utf8'});
          assert.equal(details.status,0);assert.match(details.stderr,/flags=.*\bruntime\b/);
          assert.match(details.stderr,/TeamIdentifier=[A-Z0-9]{10}\b/);console.log(details.stderr);
          JS
          apps=(dist/preview/mac-*/*.app/Contents/Resources/app)
          node build/prod/smoke-native.mjs "${apps[0]}" | tee .apack/installed-evidence/installed-signed-native.log
      - name: Installed SQLite app lifecycle
        if: ${{ startsWith(inputs.suite, 'installed') }}
        env:
          APACK_STORAGE_FORMAT: sqlite/1
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.apack/installed-evidence/installed-app.json
        run: |
          apps=(dist/preview/mac-*/*.app/Contents/Resources/app)
          executables=("${apps[0]}"/../../MacOS/*)
          if (( ${#executables[@]} != 1 )) || [[ ! -x "${executables[0]}" ]]; then
            echo 'Expected one packaged Preview executable'; exit 1
          fi
          unset APACK_HOST_ROOT
          export APACK_HOST_EXECUTABLE="${executables[0]}"
          node scripts/with-source.mjs node_modules/.bin/playwright test tests/e2e/smoke tests/e2e/app-integration/sqlite-storage.spec.ts --workers 1 --reporter=line,json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const report=JSON.parse(fs.readFileSync(process.env.PLAYWRIGHT_JSON_OUTPUT_NAME,'utf8'));
          const specs=suites=>suites.flatMap(s=>[...(s.specs??[]),...specs(s.suites??[])]);
          const witness=specs(report.suites).find(s=>s.title==='packaged SQLite stores hold their model claims across the real API process');
          assert(witness?.ok&&witness.tests.every(t=>t.results.some(r=>r.status==='passed')),'Actual packaged SQLite witness must execute');
          assert(report.stats.expected>=6&&report.stats.unexpected===0&&report.stats.skipped===0&&report.stats.flaky===0,'Installed app checks must pass without skips or retries');
          fs.writeFileSync('.apack/installed-evidence/verification.json',JSON.stringify({stats:report.stats,sqliteWitness:witness.title},null,2)+'\n');
          NODE
      - name: Host contract dependencies
        if: ${{ inputs.suite == 'host-windows' }}
        run: npm run packages:build
      - name: Focused Windows ownership and recovery
        if: ${{ inputs.suite == 'host-windows' }}
        env:
          EARS_EVALUATION_BACKEND: sqlite
        run: |
          node -e "require('node:fs').mkdirSync('.apack/tests/results',{recursive:true})"
          npm test -w @apackdev/host -- tests/database/write-lock.spec.ts tests/backup/recovery.spec.ts --maxWorkers 2 --reporter=default --reporter=json --outputFile=../../.apack/tests/results/host-windows.json
      - name: Runtime smoke
        if: ${{ inputs.suite == 'packaged' }}
        run: npm run test:smoke
      - name: Packaged authoring producer
        if: ${{ inputs.suite == 'packaged' }}
        run: npm run test:packaged-authoring:author
      - name: Packaged authoring app consumer
        if: ${{ inputs.suite == 'packaged' }}
        run: npm run test:packaged-authoring:app
      - name: Build fixture contracts
        id: preparation
        if: ${{ inputs.suite == 'all' || inputs.suite == 'external' || inputs.suite == 'bundled-ui' || inputs.suite == 'cli' || inputs.suite == 'integration' }}
        run: npm run test:external-pack:contract
      - name: Selected integration files
        if: ${{ inputs.suite == 'integration' }}
        env:
          APACK_INTEGRATION_FILES: ${{ inputs.test }}
        run: |
          read -r -a files <<< "$APACK_INTEGRATION_FILES"
          if (( ${#files[@]} == 0 )); then echo 'Name explicit integration or native spec files'; exit 1; fi
          integration=(); native=()
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then echo "No such spec: $file"; exit 1
            elif [[ "$file" == packages/*/*.integration.spec.ts ]]; then integration+=("$file")
            elif [[ "$file" == packages/*/*.native.spec.ts ]]; then native+=("$file")
            else echo "Not an integration or native spec: $file"; exit 1
            fi
          done
          mkdir -p .apack/tests/results
          # Each half runs under its own root config, which is what includes its files. The native half's live
          # watchers run one at a time, as the strict gate's native job runs them: two at once on this runner
          # starve each other's rebuild deadlines
          run() {
            node scripts/with-source.mjs node node_modules/vitest/vitest.mjs run --config "vitest.$1.config.ts" "${@:3}" --poolOptions.threads.maxThreads=$2 --poolOptions.threads.minThreads=1 --poolOptions.forks.maxForks=$2 --poolOptions.forks.minForks=1 --bail=1 --reporter=default --reporter=json --outputFile=".apack/tests/results/$1.json"
          }
          if (( ${#integration[@]} )); then run integration 2 "${integration[@]}"; fi
          if (( ${#native[@]} )); then run native 1 "${native[@]}"; fi
      - name: Prepare external default fork
        if: ${{ inputs.suite == 'all' || inputs.suite == 'external' }}
        run: npm run test:external-pack:fork
      - name: Selected external pack app suite
        if: ${{ inputs.suite == 'all' || inputs.suite == 'external' || inputs.suite == 'bundled-ui' }}
        working-directory: ${{ inputs.suite == 'bundled-ui' && 'tests/packs/bundled-ui-pack' || 'tests/packs/external-pack' }}
        env:
          APACK_E2E_GREP: ${{ inputs.test }}
        run: |
          args=(--host "$GITHUB_WORKSPACE" --prebuilt --trace retain-on-failure --repeat-each "$APACK_E2E_REPEAT")
          if [[ -n "$APACK_E2E_GREP" ]]; then args+=(--grep "$APACK_E2E_GREP"); fi
          ../../../node_modules/.bin/apack pack test "${args[@]}"
      - name: Source app test types and settings harness lint
        if: ${{ inputs.suite == 'app' }}
        run: |
          node_modules/.bin/oxlint tests/e2e/ui/host-settings.spec.ts -D correctness
          node_modules/.bin/tsc -p tests --noEmit --incremental false
      - name: App suites including settings recovery
        if: ${{ !cancelled() && (inputs.suite == 'all' || inputs.suite == 'app') && steps.runtime.outcome == 'success' }}
        env:
          APACK_E2E_GREP: ${{ inputs.test }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.apack/tests/results/source-app.json
        run: |
          args=(--repeat-each "$APACK_E2E_REPEAT")
          if [[ -n "$APACK_E2E_GREP" ]]; then args+=(--grep "$APACK_E2E_GREP"); fi
          npm run test:e2e -- "${args[@]}" --reporter=line,json
      - name: Retain app suites before the CLI scenario
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-${{ github.sha }}-suites
          include-hidden-files: true
          path: |
            .apack/tests/results/
            .apack/installed-evidence/
            tests/packs/*/.apack/tests/results/
            tests/packs/*/dist/build-inputs.json
      - name: Compiler queue lifecycle
        if: ${{ inputs.suite == 'cli' }}
        run: node scripts/with-source.mjs node node_modules/vitest/vitest.mjs run --project @apackdev/cli packages/apack-cli/tests/build/pack-builder.spec.ts --maxWorkers 2
      - name: Source pack dev install and rebuild
        if: ${{ !cancelled() && (inputs.suite == 'all' || inputs.suite == 'cli') && steps.preparation.outcome == 'success' }}
        run: node scripts/with-source.mjs tsx tests/scripts/test-pack-dev.ts
      - name: Real LMDB import and rollback
        if: ${{ !cancelled() && inputs.suite == 'all' && steps.preparation.outcome == 'success' }}
        working-directory: packages/apack-host
        run: node ../../scripts/with-source.mjs node ../../node_modules/vitest/vitest.mjs run tests/backup/import.spec.ts --maxWorkers 2
      - name: Retain app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-${{ github.sha }}
          include-hidden-files: true
          path: |
            .apack/tests/results/
            .apack/installed-evidence/
            tests/packs/*/.apack/tests/results/
            tests/packs/*/dist/build-inputs.json
      - name: Remove installed signing keychain
        if: ${{ always() && inputs.suite == 'installed-signed' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/apack-installed-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/apack-installed-signing.p12"

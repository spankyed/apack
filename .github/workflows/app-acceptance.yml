name: App acceptance

on:
  workflow_dispatch:
    inputs:
      suite:
        description: App acceptance suite; all also exercises the source CLI
        type: choice
        options: [all, app, external, bundled-ui, host-windows, sqlite, sqlite-admission, sqlite-bench, sqlite-model-windows, sqlite-api, sqlite-corpus, sqlite-relevance, sqlite-graph-wasm, sqlite-vector-dispatch, cli, build, integration, packaged, installed, installed-signed, installed-platform, activation-profile, windows-durability]
        default: all
      sqlite_vector_models:
        description: Real corpus vector regime; managed verifies native readiness above the exact-search threshold
        type: choice
        options: [fallback, managed]
        default: fallback
      sqlite_vector_backend:
        description: Corpus-only paired upstream dispatch diagnostic; ordinary artifacts remain generic
        type: choice
        options: [packaged, paired-dispatch]
        default: packaged
      sqlite_native_candidate_floor:
        description: Corpus-only diagnostic override; production keeps the current native candidate policy
        type: choice
        options: [production, '1024', '2048']
        default: production
      sqlite_admission_checkpoint_probe:
        description: Alternate 1000/128-page checkpoints on 100k FULL value admission; diagnostic only
        type: boolean
        default: false
      sqlite_admission_trace:
        description: Instrument only one 100k FULL value trial; diagnostic, not latency acceptance
        type: boolean
        default: false
      storage_format:
        description: Storage for isolated source app/pack qualification; installed suites select SQLite explicitly
        type: choice
        options: [elmdb/1, sqlite/1]
        default: elmdb/1
      test:
        description: Playwright name pattern; integration requires space-separated integration or native spec file paths
        type: string
        default: ''
      repeat_each:
        description: Repeat each selected app or pack Playwright case (1-20)
        type: number
        default: 1
  workflow_call:
    inputs:
      suite:
        type: string
        default: all
      sqlite_vector_models:
        type: string
        default: fallback
      sqlite_vector_backend:
        type: string
        default: packaged
      sqlite_native_candidate_floor:
        type: string
        default: production
      sqlite_admission_checkpoint_probe:
        description: Alternate 1000/128-page checkpoints on 100k FULL value admission; diagnostic only
        type: boolean
        default: false
      sqlite_admission_trace:
        description: Instrument only one 100k FULL value trial; diagnostic, not latency acceptance
        type: boolean
        default: false
      storage_format:
        type: string
        default: elmdb/1
      test:
        type: string
        default: ''
      repeat_each:
        type: number
        default: 1

permissions:
  contents: read

concurrency:
  group: app-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sqlite:
    if: ${{ inputs.suite == 'sqlite' }}
    uses: ./.github/workflows/ears-sqlite.yml
  activation-profile:
    if: ${{ inputs.suite == 'activation-profile' }}
    uses: ./.github/workflows/ears-activation-profile.yml
  windows-durability:
    if: ${{ inputs.suite == 'windows-durability' }}
    uses: ./.github/workflows/ears-windows-durability.yml
  installed-platform:
    if: ${{ inputs.suite == 'installed-platform' }}
    uses: ./.github/workflows/ears-installed-platform.yml
  sqlite-graph-wasm:
    if: ${{ inputs.suite == 'sqlite-graph-wasm' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-runtime
        with:
          node-version: 23.11.1
      - name: Build pinned portable Leiden core
        working-directory: native/graphs
        run: |
          set -o pipefail
          mkdir -p ../../.temp/sqlite-graph-wasm
          git rev-parse HEAD > ../../.temp/sqlite-graph-wasm/source.txt
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add wasm32-unknown-unknown
          cargo generate-lockfile
          cargo build --locked --release --target wasm32-unknown-unknown 2>&1 | tee ../../.temp/sqlite-graph-wasm/build.log
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
          wasm-bindgen --target nodejs --out-dir ../../.temp/sqlite-graph-wasm --out-name ears_graph target/wasm32-unknown-unknown/release/ears_graph.wasm
          node -e "require('fs').writeFileSync('../../.temp/sqlite-graph-wasm/package.json',JSON.stringify({type:'commonjs'}))"
          node probe.mjs ../../.temp/sqlite-graph-wasm 2>&1 | tee ../../.temp/sqlite-graph-wasm/probe.log
      - name: Preserve portable core and lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ears-sqlite-graph-wasm-${{ github.run_id }}
          path: |
            native/graphs/Cargo.lock
            .temp/sqlite-graph-wasm
          if-no-files-found: error
          retention-days: 14
  sqlite-admission:
    if: ${{ inputs.suite == 'sqlite-admission' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((inputs.sqlite_admission_trace || inputs.sqlite_admission_checkpoint_probe) && '[{"kind":"value","durability":"full"}]' || '[{"kind":"value","durability":"off"},{"kind":"value","durability":"full"},{"kind":"search","durability":"off"},{"kind":"search","durability":"full"}]') }}
    env:
      CARGO_BUILD_JOBS: 2
      npm_config_jobs: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-runtime
        with:
          node-version: 23.11.1
      - uses: ./.github/actions/elmdb
      - name: Prepare matching admission runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run packages:build
          npm run typecheck -w @apackdev/ears
          npm run typecheck:host
      - name: Admission trials or explicit runtime diagnostic under enforced limits
        env:
          ADMISSION_KIND: ${{ matrix.kind }}
          ADMISSION_DURABILITY: ${{ matrix.durability }}
          ADMISSION_TRACE: ${{ inputs.sqlite_admission_trace }}
          ADMISSION_CHECKPOINT_PROBE: ${{ inputs.sqlite_admission_checkpoint_probe }}
        run: |
          set -euo pipefail
          mkdir -p .temp/sqlite-admission
          git rev-parse HEAD > .temp/sqlite-admission/source.txt
          docker build -t ears-admission-runtime - <<'DOCKER'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends python3 git libstdc++6 && rm -rf /var/lib/apt/lists/*
          DOCKER
          docker image inspect ears-admission-runtime --format '{{.Id}}' > .temp/sqlite-admission/image.txt
          admission_node_binary=$(command -v node)
          arguments=()
          if [ "$ADMISSION_KIND" = search ]; then arguments+=(--search); fi
          if [ "$ADMISSION_DURABILITY" = full ]; then arguments+=(--durable); fi
          docker run --rm --network none --cpus 2 --memory 6g --memory-swap 6g --cap-drop ALL \
            --user "$(id -u):$(id -g)" --workdir /workspace -e PATH=/runtime:/usr/bin:/bin \
            -e GITHUB_SHA="$GITHUB_SHA" -e ADMISSION_TRACE="$ADMISSION_TRACE" -e ADMISSION_CHECKPOINT_PROBE="$ADMISSION_CHECKPOINT_PROBE" -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$admission_node_binary:/runtime/node:ro" \
            -v "$GITHUB_WORKSPACE/.temp/sqlite-admission:/results" \
            ears-admission-runtime bash .github/scripts/ears-admission-run.sh "${arguments[@]}"
      - name: Retain all admission trial outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ears-sqlite-admission-${{ matrix.kind }}-${{ matrix.durability }}-${{ github.run_id }}
          path: .temp/sqlite-admission
          if-no-files-found: error
          retention-days: 14
  sqlite-bench:
    if: ${{ inputs.suite == 'sqlite-bench' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        durability: ['off', 'full']
    env:
      CARGO_BUILD_JOBS: 2
      npm_config_jobs: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-runtime
        with:
          node-version: 23.11.1
      - uses: ./.github/actions/elmdb
      - name: Prepare matching benchmark runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run packages:build
          npm run typecheck -w @apackdev/ears
      - name: Sequential fresh-process backend trials under enforced limits
        env:
          BENCH_DURABILITY: ${{ matrix.durability }}
        run: |
          set -euo pipefail
          mkdir -p .temp/sqlite-bench
          git rev-parse HEAD > .temp/sqlite-bench/source.txt
          docker build -t ears-bench-runtime - <<'DOCKER'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends python3 git libstdc++6 && rm -rf /var/lib/apt/lists/*
          DOCKER
          docker image inspect ears-bench-runtime --format '{{.Id}}' > .temp/sqlite-bench/image.txt
          bench_node_binary=$(command -v node)
          arguments=()
          case "$BENCH_DURABILITY" in
            off) ;;
            full) arguments+=(--durable) ;;
            *) echo 'Expected off or full benchmark durability'; exit 1 ;;
          esac
          docker run --rm --network none --cpus 2 --memory 6g --memory-swap 6g --cap-drop ALL \
            --user "$(id -u):$(id -g)" --workdir /workspace -e PATH=/runtime:/usr/bin:/bin \
            -e GITHUB_SHA="$GITHUB_SHA" -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$bench_node_binary:/runtime/node:ro" -v "$GITHUB_WORKSPACE/.temp/sqlite-bench:/results" \
            ears-bench-runtime bash .github/scripts/ears-bench-run.sh "${arguments[@]}"
      - name: Retain all benchmark outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ears-sqlite-bench-${{ matrix.durability }}-${{ github.run_id }}
          path: .temp/sqlite-bench
          if-no-files-found: error
          retention-days: 14
  sqlite-vector-dispatch:
    if: ${{ inputs.suite == 'sqlite-vector-dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      npm_config_jobs: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-runtime
        with:
          node-version: 23.11.1
      - uses: ./.github/actions/elmdb
      - name: Prepare matching driver and compile diagnostic artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck -w @apackdev/ears
          node_modules/.bin/oxlint packages/apack-ears/tests/sqlite/vector-cosine.spec.ts -D correctness
          mkdir -p .temp/vector-dispatch
          git rev-parse HEAD > .temp/vector-dispatch/source.txt
          node native/vectors/build.mjs .temp/vector-dispatch/generic
          node native/vectors/dispatch-build.mjs .temp/vector-dispatch/generic .temp/vector-dispatch/dispatch
      - name: Verify actual selected backend and independent membership contracts
        run: |
          set -euo pipefail
          for variant in generic dispatch; do
            node native/vectors/membership-test.mjs ".temp/vector-dispatch/$variant/vec1.so" ".temp/vector-dispatch/$variant-membership.json"
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { cpus } from 'node:os';
          import Database from 'better-sqlite3';
          const flags = new Set((readFileSync('/proc/cpuinfo', 'utf8').match(/^flags\s*:\s*(.+)$/m)?.[1] ?? '').split(/\s+/));
          const report = { completed: false, source: process.env.GITHUB_SHA, node: process.version,
            cpuModels: [...new Set(cpus().map(cpu => cpu.model))], avx2Exposed: flags.has('avx2'), variants: [],
            scope: 'Build/runtime/membership diagnostic only; no latency, recall or unsupported-CPU qualification' };
          try {
            for (const variant of ['generic', 'dispatch']) {
              const file = `.temp/vector-dispatch/${variant}/vec1.so`;
              const db = new Database(':memory:');
              try {
                db.loadExtension(file);
                const runtime = db.prepare('SELECT vec1_info() value').get().value;
                report.variants.push({ variant, runtime, sha256: createHash('sha256').update(readFileSync(file)).digest('hex') });
                assert(runtime.includes(variant === 'dispatch' && report.avx2Exposed ? '(AVX2,' : '(Scalar,'));
                const membership = JSON.parse(readFileSync(`.temp/vector-dispatch/${variant}-membership.json`, 'utf8'));
                assert.equal(membership.completed, true);
                assert.equal(membership.groups.length, 15);
                assert.equal(membership.groups.reduce((n, group) => n + group.checks, 0), 735);
              } finally { db.close(); }
            }
            report.completed = true;
          } catch (error) {
            report.failure = { message: error?.message ?? String(error), stack: error?.stack };
            throw error;
          } finally {
            writeFileSync('.temp/vector-dispatch/runtime.json', JSON.stringify(report, null, 2) + '\n', { flag: 'wx' });
          }
          JS
      - name: Verify persisted trained models in both backend directions
        run: |
          node native/vectors/dispatch-model-test.mjs compare \
            .temp/vector-dispatch/generic/vec1.so .temp/vector-dispatch/dispatch/vec1.so \
            .temp/vector-dispatch/cross-backend-models.json
      - name: Real EARS training worker ownership and checkpoint contracts
        run: |
          set -euo pipefail
          for variant in generic dispatch; do
            EARS_EVALUATION_BACKEND=sqlite EARS_VEC1_EXTENSION="$GITHUB_WORKSPACE/.temp/vector-dispatch/$variant/vec1.so" \
              npm test -w @apackdev/ears -- tests/sqlite/vector-training.spec.ts tests/sqlite/vector-cosine.spec.ts --maxWorkers=2 \
              --reporter=default --reporter=json --outputFile="../../.temp/vector-dispatch/$variant-training.json" \
              2>&1 | tee ".temp/vector-dispatch/$variant-training.log"
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          for (const variant of ['generic', 'dispatch']) {
            const report = JSON.parse(readFileSync(`.temp/vector-dispatch/${variant}-training.json`, 'utf8'));
            assert.equal(report.numFailedTests, 0); assert.equal(report.numPendingTests, 0);
            const file = report.testResults.find(file => file.name.replaceAll('\\', '/').endsWith('/tests/sqlite/vector-training.spec.ts'));
            assert(file?.assertionResults.length > 0);
            for (const test of file.assertionResults) assert.equal(test.status, 'passed', test.fullName);
            const cosine = report.testResults.find(file => file.name.replaceAll('\\', '/').endsWith('/tests/sqlite/vector-cosine.spec.ts'));
            assert.equal(cosine?.assertionResults.length, 7);
            for (const test of cosine.assertionResults) assert.equal(test.status, 'passed', test.fullName);
            for (const syncs of [false, true]) assert(file.assertionResults.some(test => test.fullName.endsWith(
              `keeps foreground writes live while a training snapshot pins WAL, then releases the checkpoint (${syncs} syncs)`)));
          }
          JS
      - name: Compare existing cosine functions under bounded synthetic load
        run: |
          set -euo pipefail
          docker pull ubuntu:24.04
          docker image inspect ubuntu:24.04 --format '{{json .RepoDigests}}' > .temp/vector-dispatch/kernel-image.json
          kernel_node_binary=$(command -v node)
          docker run --rm --network none --cpus 2 --memory 6g --memory-swap 6g --cap-drop ALL \
            --user "$(id -u):$(id -g)" --workdir /workspace -e GITHUB_SHA="$GITHUB_SHA" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$kernel_node_binary:/runtime/node:ro" \
            -v "$GITHUB_WORKSPACE/.temp/vector-dispatch:/results" \
            ubuntu:24.04 /runtime/node --experimental-strip-types native/vectors/distance-kernel.mjs compare \
            .temp/vector-dispatch/generic/vec1.so .temp/vector-dispatch/dispatch/vec1.so \
            /results/distance-kernel.json
      - name: Preserve diagnostic source, commands and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ears-vector-dispatch-${{ github.run_id }}
          path: .temp/vector-dispatch
          if-no-files-found: error
          retention-days: 14
  sqlite-corpus:
    if: ${{ inputs.suite == 'sqlite-corpus' }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.sqlite_vector_backend == 'paired-dispatch' && 60 || 30 }}
    env:
      SQLITE_VECTOR_BACKEND: ${{ inputs.sqlite_vector_backend || 'packaged' }}
      SQLITE_VECTOR_MODE: ${{ inputs.sqlite_vector_models }}
      SQLITE_NATIVE_CANDIDATE_FLOOR: ${{ inputs.sqlite_native_candidate_floor }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-runtime
        with:
          node-version: 23.11.1
      - uses: ./.github/actions/elmdb
      - name: Prepare matching hybrid runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CARGO_BUILD_JOBS: 2
          npm_config_jobs: 2
        run: |
          set -euo pipefail
          case "$SQLITE_VECTOR_BACKEND" in
            packaged) ;;
            paired-dispatch)
              PYTHONDONTWRITEBYTECODE=1 python3 docs/references/evidence/ears-sqlite-implementation-2026-10-28/vector-pair-protocol/control.py
              test "$SQLITE_VECTOR_MODE" = managed
              test "$SQLITE_NATIVE_CANDIDATE_FLOOR" = production
              ;;
            *) exit 1 ;;
          esac
          npm ci
          npm run packages:build
          if test "$SQLITE_VECTOR_BACKEND" = paired-dispatch; then
            mkdir -p .temp/sqlite-corpus/native-build
            node native/vectors/build.mjs .temp/sqlite-corpus/native-build/generic
            node native/vectors/dispatch-build.mjs .temp/sqlite-corpus/native-build/generic .temp/sqlite-corpus/native-build/dispatch
            node native/vectors/membership-test.mjs .temp/sqlite-corpus/native-build/dispatch/vec1.so .temp/sqlite-corpus/dispatch-membership.json
            node native/vectors/dispatch-model-test.mjs compare \
              .temp/sqlite-corpus/native-build/generic/vec1.so .temp/sqlite-corpus/native-build/dispatch/vec1.so \
              .temp/sqlite-corpus/cross-backend-models.json
          fi
      - name: Query routing and replacement outcome safeguards
        env:
          EARS_EVALUATION_BACKEND: sqlite
        run: |
          set -euo pipefail
          mkdir -p .temp/sqlite-corpus
          git rev-parse HEAD > .temp/sqlite-corpus/source.txt
          npm test -w @apackdev/ears -- tests/sqlite/vector-execution.spec.ts tests/sqlite/commit-outcomes.spec.ts tests/sqlite/text-scope.spec.ts tests/sqlite/hybrid-highlights.spec.ts \
            --maxWorkers 2 --reporter=default --reporter=json --outputFile=../../.temp/sqlite-corpus/safeguards.json \
            2>&1 | tee .temp/sqlite-corpus/safeguards.log
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('.temp/sqlite-corpus/safeguards.json', 'utf8'));
          assert.equal(report.numFailedTests, 0); assert.equal(report.numPendingTests, 0);
          for (const name of ['vector-execution.spec.ts', 'commit-outcomes.spec.ts', 'text-scope.spec.ts', 'hybrid-highlights.spec.ts']) {
            const file = report.testResults.find(test => test.name.replaceAll('\\', '/').endsWith('/tests/sqlite/' + name));
            assert(file?.assertionResults.length > 0, `Required safeguard file must execute: ${name}`);
            for (const test of file.assertionResults) assert.equal(test.status, 'passed', test.fullName);
          }
          const names = report.testResults.flatMap(file => file.assertionResults.map(test => test.fullName));
          for (const title of [
            'uses posting estimates without reevaluating the candidate prefix and still scopes actual matches',
            'stops a streaming eligibility scope at the chunk threshold and keeps limited, duplicate and empty scopes exact',
            'refuses replacement before commit when closing its source fails',
            'formats only final lexical winners while preserving global fusion scores, list highlights and scoped mixed-type answers',
            'keeps deferred text details in the ranking snapshot when an independent writer commits between phases',
          ]) assert(names.some(name => name.endsWith(title)), `Required safeguard must be collected: ${title}`);
          JS
      - name: Acquire and verify the full private paired corpus
        env:
          SQLITE_VECTOR_MODE: ${{ inputs.sqlite_vector_models }}
          SQLITE_NATIVE_CANDIDATE_FLOOR: ${{ inputs.sqlite_native_candidate_floor }}
        run: |
          set -euo pipefail
          mkdir -p .temp/sqlite-corpus
          git rev-parse HEAD > .temp/sqlite-corpus/source.txt
          private_fixture=$(mktemp -d "$RUNNER_TEMP/ears-private-corpus-XXXXXX")
          cleanup_fixture() {
            fixture_exit_code=$?
            if rm -rf "$private_fixture" && test ! -e "$private_fixture"; then
              echo '{"privateScratchRemoved":true}' > .temp/sqlite-corpus/cleanup.json
            else
              echo '{"privateScratchRemoved":false}' > .temp/sqlite-corpus/cleanup.json
              fixture_exit_code=1
            fi
            return "$fixture_exit_code"
          }
          trap cleanup_fixture EXIT
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}' > .temp/sqlite-corpus/image.json
          docker run --rm --cpus 2 --memory 6g --memory-swap 6g --cap-drop ALL --user "$(id -u):$(id -g)" \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE/packages/apack-ears/bench/sqlite:/recipe:ro" \
            -v "$GITHUB_WORKSPACE/.temp/sqlite-corpus:/results" -v "$private_fixture:/private" \
            python:3.12-slim sh -ec '
              python -m pip install --no-cache-dir --target /private/tools pyarrow==26.0.0 numpy==2.5.4 > /results/install.log 2>&1
              PYTHONPATH=/private/tools python /recipe/acquire-real-vectors.py --with-text --output /private/corpus > /results/acquire.log 2>&1
              python /recipe/qualify-real-corpus.py --corpus /private/corpus --output /results/qualification.json
              PYTHONPATH=/private/tools python /recipe/hybrid-vector-oracle.py --corpus /private/corpus --output /private/corpus/hybrid-vector-truth.json
              cp /private/corpus/manifest.json /results/corpus-manifest.json
            '
          # The same matching Node binary/dependencies run read-only under explicit workload limits.
          hybrid_node_binary=$(node -p 'process.execPath')
          docker pull ubuntu:24.04
          docker image inspect ubuntu:24.04 --format '{{json .RepoDigests}}' > .temp/sqlite-corpus/node-image.json
          mkdir -p "$private_fixture/runtime"
          variants=(packaged)
          if test "$SQLITE_VECTOR_BACKEND" = paired-dispatch; then variants=(generic dispatch); fi
          if test "$SQLITE_VECTOR_BACKEND" = paired-dispatch; then
            for variant in "${variants[@]}"; do
              mkdir -p ".temp/sqlite-corpus/$variant"
              cp .temp/sqlite-corpus/corpus-manifest.json ".temp/sqlite-corpus/$variant/corpus-manifest.json"
            done
          fi
          for size in 1000 10000 99900; do
            # Reverse the middle pair; cache/model variance remains explicitly uncontrolled.
            if test "$SQLITE_VECTOR_BACKEND" = paired-dispatch; then
              variants=(generic dispatch)
              if test "$size" = 10000; then variants=(dispatch generic); fi
            fi
            for variant in "${variants[@]}"; do
              extension=packaged
              result_path=/results
              if test "$variant" != packaged; then result_path=/results/$variant; fi
              if test "$variant" = dispatch; then extension=/workspace/.temp/sqlite-corpus/native-build/dispatch; fi
              docker run --rm --network none --cpus 2 --memory 6g --memory-swap 6g --cap-drop ALL \
                --user "$(id -u):$(id -g)" --workdir /workspace \
                -e GITHUB_SHA="$GITHUB_SHA" -e GITHUB_RUN_ID="$GITHUB_RUN_ID" -e TMPDIR=/private/runtime \
                -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 \
                -v "$GITHUB_WORKSPACE:/workspace:ro" -v "$hybrid_node_binary:/runtime/node:ro" \
                -v "$private_fixture:/private" -v "$GITHUB_WORKSPACE/.temp/sqlite-corpus:/results" \
                ubuntu:24.04 /runtime/node --import tsx packages/apack-ears/bench/sqlite/real-hybrid.mjs \
                /private/corpus "$result_path/hybrid-$size.json" "$size" "$SQLITE_VECTOR_MODE" "$SQLITE_NATIVE_CANDIDATE_FLOOR" "$extension"
            done
          done
          qualification_status=0
          for variant in "${variants[@]}"; do
            result_directory=.temp/sqlite-corpus
            if test "$variant" != packaged; then result_directory=$result_directory/$variant; fi
            python3 packages/apack-ears/bench/sqlite/qualify-real-hybrid.py --results "$result_directory" \
              --source "$GITHUB_SHA" --output "$result_directory/hybrid-matrix.json" || qualification_status=1
          done
          if test "$SQLITE_VECTOR_BACKEND" = paired-dispatch; then
            python3 packages/apack-ears/bench/sqlite/compare-vector-builds.py --results .temp/sqlite-corpus \
              --source "$GITHUB_SHA" --output .temp/sqlite-corpus/vector-build-comparison.json || qualification_status=1
          fi
          exit "$qualification_status"

      - name: Retain metadata receipts only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ears-sqlite-corpus-${{ github.run_id }}
          path: |
            .temp/sqlite-corpus
            !.temp/sqlite-corpus/native-build/**/*.c
            !.temp/sqlite-corpus/native-build/**/*.o
            !.temp/sqlite-corpus/native-build/**/*.so
          if-no-files-found: error
          retention-days: 14
  sqlite-relevance:
    if: ${{ inputs.suite == 'sqlite-relevance' || (inputs.suite == 'sqlite-corpus' && inputs.sqlite_native_candidate_floor == 'production') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      npm_config_jobs: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-runtime
        with:
          node-version: 23.11.1
      - uses: ./.github/actions/elmdb
      - name: Prepare matching backend runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run packages:build
      - name: Local inference and original app judgments on both backends
        run: |
          set -euo pipefail
          mkdir -p .temp/sqlite-relevance
          git rev-parse HEAD > .temp/sqlite-relevance/source.txt
          private_relevance=$(mktemp -d "$RUNNER_TEMP/ears-private-relevance-XXXXXX")
          trap 'rm -rf "$private_relevance"' EXIT
          docker pull python:3.12-slim
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}' > .temp/sqlite-relevance/image.json
          docker run --rm --cpus 2 --memory 6g --memory-swap 6g --cap-drop ALL --user "$(id -u):$(id -g)" \
            -e OPENBLAS_NUM_THREADS=1 -e OMP_NUM_THREADS=1 -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$GITHUB_WORKSPACE/packages/apack-ears/bench/sqlite:/recipe:ro" \
            -v "$GITHUB_WORKSPACE/packages/apack-ears/tests/fixtures/real-search-relevance.json:/fixture.json:ro" \
            -v "$GITHUB_WORKSPACE/.temp/sqlite-relevance:/results" -v "$private_relevance:/private" \
            python:3.12-slim sh -ec '
              python -m pip install --no-cache-dir --no-deps --target /private/tools -r /recipe/relevance-runtime.txt > /results/install.log 2>&1
              PYTHONPATH=/private/tools python /recipe/embed-app-relevance.py --fixture /fixture.json --output /private/vectors --receipt /results/model.json
            '
          failed=0
          for backend in elmdb sqlite; do
            if ! node --import tsx packages/apack-ears/bench/sqlite/app-hybrid-relevance.mjs \
              packages/apack-ears/tests/fixtures/real-search-relevance.json "$private_relevance/vectors/vectors.json" \
              ".temp/sqlite-relevance/$backend.json" "$backend"; then failed=1; fi
          done
          if ! python3 packages/apack-ears/bench/sqlite/qualify-app-relevance.py \
            --fixture packages/apack-ears/tests/fixtures/real-search-relevance.json --results .temp/sqlite-relevance \
            --source "$GITHUB_SHA" --output .temp/sqlite-relevance/judgments.json; then failed=1; fi
          rm -rf "$private_relevance"
          test ! -e "$private_relevance"
          trap - EXIT
          echo '{"privateScratchRemoved":true}' > .temp/sqlite-relevance/cleanup.json
          exit "$failed"
      - name: Evaluate explicit English text stemming without changing the frozen gate
        run: |
          set -euo pipefail
          node --import tsx packages/apack-ears/bench/sqlite/app-text-language.mjs \
            packages/apack-ears/tests/fixtures/real-search-relevance.json .temp/sqlite-relevance/text-language.json
          python3 packages/apack-ears/bench/sqlite/qualify-text-language.py \
            --fixture packages/apack-ears/tests/fixtures/real-search-relevance.json \
            --report .temp/sqlite-relevance/text-language.json --source "$GITHUB_SHA" \
            --output .temp/sqlite-relevance/text-language-receipt.json
      - name: Retain metadata and numeric judgments only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ears-app-hybrid-relevance-${{ github.run_id }}
          path: .temp/sqlite-relevance
          if-no-files-found: error
          retention-days: 14
  sqlite-model-windows:

      - name: Unchanged real SQLite model and watch workloads
        run: |
          set -o pipefail
          npm test -w @apackdev/ears -- tests/engine/model-based.spec.ts --maxWorkers=2 \
            --reporter=default --reporter=json --outputFile=../../.temp/sqlite-model-windows/report.json \
            2>&1 | tee .temp/sqlite-model-windows/model.log
      - name: Require actual backend and both complete model cases
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const report=JSON.parse(readFileSync('.temp/sqlite-model-windows/report.json','utf8'));
          const cases=report.testResults.flatMap(file=>file.assertionResults);
          const required=['runs the model against the selected real backend and independent empty stores',
            'refuses, holds and answers what the model does',
            'keeps every watch at what its read answers afresh, after every write, whatever wrote'];
          assert(cases.length>=required.length);
          assert.equal(new Set(cases.map(test=>test.fullName)).size,cases.length);
          for(const name of required)assert(cases.some(test=>test.fullName===name&&test.status==='passed'),name);
          for(const test of cases)assert.equal(test.status,'passed',test.fullName);
          assert.equal(report.numFailedTests,0);assert.equal(report.numPendingTests,0);
          const paths=['packages/apack-ears/tests/engine/model-based.spec.ts','packages/apack-ears/tests/_harness/model.ts','packages/apack-ears/tests/_harness/workload.ts','packages/apack-ears/vitest.config.ts','package-lock.json'];
          writeFileSync('.temp/sqlite-model-windows/receipt.json',JSON.stringify({source:process.env.GITHUB_SHA,
            node:process.version,platform:process.platform,arch:process.arch,
            inputs:Object.fromEntries(paths.map(path=>[path,createHash('sha256').update(readFileSync(path)).digest('hex')])),
            cases:cases.map(test=>({name:test.fullName,status:test.status,durationMs:test.duration})),
            scope:'Original 120 random and 40 watch workloads; unchanged 30s per-test deadline; isolated Windows verification does not replace full-suite concurrency acceptance'},null,2)+'\n');
          JS
      - name: Preserve complete focused model outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ears-sqlite-model-windows-${{ github.run_id }}
          path: .temp/sqlite-model-windows
          if-no-files-found: error
          retention-days: 14
  sqlite-api:
    if: ${{ inputs.suite == 'sqlite-api' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      APACK_CHAIN_CORES: 2
      CARGO_BUILD_JOBS: 2
      npm_config_jobs: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-runtime
        with:
          node-version: 23.11.1
      - uses: ./.github/actions/elmdb
      - name: Install matching dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Regenerate EARS API from matching published packages
        run: |
          set -o pipefail
          mkdir -p .temp/sqlite-api
          git rev-parse HEAD > .temp/sqlite-api/source.txt
          cp vendor/elmdb.rev .temp/sqlite-api/elmdb.rev
          npm run packages:build 2>&1 | tee .temp/sqlite-api/packages.log
          node native/graphs/probe.mjs packages/apack-ears/dist/sqlite/graph .temp/sqlite-api/graph-report.json 2>&1 | tee .temp/sqlite-api/graph-probe.log
          npm run api:update -w @apackdev/ears 2>&1 | tee .temp/sqlite-api/update.log
          npm run api:check -w @apackdev/ears 2>&1 | tee .temp/sqlite-api/check.log
          git diff -- packages/apack-ears/etc > .temp/sqlite-api/reports.patch
      - name: Ready native routing boundary and unit visibility
        run: |
          set -euo pipefail
          native_extension=$(node --import tsx --input-type=module -e "import {resolveNativeVectorExtension} from './packages/apack-ears/src/sqlite/native-extension.ts'; console.log(resolveNativeVectorExtension())")
          EARS_EVALUATION_BACKEND=sqlite EARS_VEC1_EXTENSION="$native_extension" npm test -w @apackdev/ears -- tests/sqlite/vector-models.spec.ts \
            -t 'routes real EARS queries through ready native candidates' --maxWorkers 2 \
            --reporter=default --reporter=json --outputFile=../../.temp/sqlite-api/native-routing.json \
            2>&1 | tee .temp/sqlite-api/native-routing.log
          node --input-type=module -e "import assert from 'node:assert/strict'; import {readFileSync} from 'node:fs'; const report=JSON.parse(readFileSync('.temp/sqlite-api/native-routing.json','utf8')); assert.equal(report.numPassedTests,1); assert.equal(report.numFailedTests,0)"
      - name: Real persisted WAL commit before application acknowledgement
        run: >-
          python3 packages/apack-ears/bench/sqlite/lost-ack.py
          --output .temp/sqlite-api/lost-ack
      - name: Error returned after real WAL sync then killed without connection cleanup
        run: >-
          python3 packages/apack-ears/bench/sqlite/lost-ack.py --return-sync-error
          --output .temp/sqlite-api/sync-error-no-close
      - name: Integration subprocess and build-input ownership
        run: >-
          npm test -w @app/repo-checks -- tests/subprocess-inventory.spec.ts tests/chain-inputs.spec.ts --maxWorkers 2
          --reporter=default --reporter=json --outputFile=../../.temp/sqlite-api/subprocess-inventory.json
          2>&1 | tee .temp/sqlite-api/subprocess-inventory.log
      - name: Typecheck candidate source and contract tests
        run: |
          npm run typecheck -w @apackdev/ears
          node_modules/.bin/oxlint packages/apack-ears/src/sqlite/database.ts \
            packages/apack-ears/tests/sqlite/relation-audit.spec.ts native/vectors/distance-kernel.mjs -D correctness
      - name: Scoped pack readiness and lifecycle contracts
        run: >-
          npm test -w @apackdev/host -- tests/packs/registration.spec.ts
          tests/packs/runtime/lifecycle.spec.ts tests/packs/runtime/reload.spec.ts
          --maxWorkers 2 --reporter=default --reporter=json --outputFile=../../.temp/sqlite-api/pack-readiness.json
          2>&1 | tee .temp/sqlite-api/pack-readiness.log
      - name: Focused shared graph, observation and search contracts on both backends
        run: |
          set -o pipefail
          files=(tests/no-module-state.spec.ts tests/watch-causes.spec.ts
                 tests/engine/relations.spec.ts tests/engine/writes.spec.ts tests/engine/graph-similarity.spec.ts
                 tests/engine/sqlite-operations.spec.ts tests/sqlite/graph-execution.spec.ts
                 tests/sqlite/elmdb-conversion.spec.ts
                 tests/engine/vector.spec.ts
                 tests/engine/observation.spec.ts tests/engine/search-relevance.spec.ts
                 tests/engine/watch.spec.ts tests/engine/model-based.spec.ts
                 tests/sqlite/index-builds.spec.ts
                 tests/sqlite/schema-validation.spec.ts
                 tests/sqlite/values.spec.ts
                 tests/sqlite/vector-execution.spec.ts
                 tests/sqlite/vector-candidates.spec.ts
                 tests/sqlite/text-scope.spec.ts
                 tests/sqlite/hybrid-highlights.spec.ts
                 tests/sqlite/relation-identity.spec.ts
                 tests/sqlite/relation-audit.spec.ts
                 tests/sqlite/read-tracking.spec.ts
                 tests/sqlite/commit-outcomes.spec.ts
                 tests/engine/search.spec.ts
                 tests/sqlite/logical-export.spec.ts
                 tests/sqlite/logical-restore.spec.ts
                 tests/engine/search-languages.spec.ts
                 tests/engine/real-search-relevance.spec.ts)
          failed=0
          for backend in elmdb sqlite; do
            if ! EARS_EVALUATION_BACKEND="$backend" npm test -w @apackdev/ears -- "${files[@]}" --maxWorkers 2 --reporter=default --reporter=json --outputFile="../../.temp/sqlite-api/$backend-contracts.json" 2>&1 | tee ".temp/sqlite-api/$backend-contracts.log"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Require real backend model and relation key witnesses
        id: relation_witnesses
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const summary=[];
          const shared=[
            'runs the model against the selected real backend and independent empty stores',
            'links treats null optional relation info as omitted, preserving an existing keyed value',
            'links keeps keyed bytes, lists and own map fields distinct, and refuses scalar keyed info atomically',
            'links a keyed kind joins two ends by one edge per value of its key, a field the info lacks being null',
            'links uses string-keyed Maps as relation info and preserves distinct nested map keys',
            'links refuses invalid relation info values before changing an edge or its commit identity',
            'attribute writes stores string-keyed Map attributes as own-field objects and refuses invalid nested maps atomically',
          ];
          for(const backend of ['elmdb','sqlite']) {
            const report=JSON.parse(readFileSync(`.temp/sqlite-api/${backend}-contracts.json`,'utf8'));
            const cases=report.testResults.flatMap(file=>file.assertionResults);
            const required=[...shared,...(backend==='sqlite'?[
              'yielding value-index admission admits a healthy type despite an unrelated failed retained index while global readiness still refuses',
              'yielding value-index admission rejects scoped readiness when its admitted generation is retired instead of accepting its replacement',
              'yielding value-index admission keeps closed and open-unit refusals even for an empty readiness scope',
              "SQLite commit outcome handling refuses malformed commit metadata without overwriting it ('null')",
              "SQLite commit outcome handling refuses malformed commit metadata without overwriting it ('numeric text')",
              'SQLite commit outcome handling commits the last representable identity then refuses further writes without data or watch changes',
              'SQLite commit outcome handling rolls back schema when the commit identity is exhausted',
              'SQLite commit outcome handling rolls back bulkLoad when the commit identity is exhausted',
              'SQLite commit outcome handling admits the last schema revision then refuses declaration and rebuild without rounding it',
              'restored logical stores audits unchecked duplicate edge identities and invalid keyed info without repairing them',
              'native text pipeline scopes uses posting estimates without reevaluating the candidate prefix and still scopes actual matches',
              'hybrid winner highlights formats only final lexical winners while preserving global fusion scores, list highlights and scoped mixed-type answers',
              'hybrid winner highlights keeps deferred text details in the ranking snapshot when an independent writer commits between phases',
              'SQLite relation identity work stops at a matching key and releases its cursor before mutation, refusal and exhaustion',
              'SQLite relation audit grouping groups distinct keys on disk and compares only colliding fingerprints without changing source data',
              'SQLite relation audit grouping checks existing equality after forced fingerprint collisions instead of inventing duplicates',
              'SQLite relation audit grouping closes and removes a failed private identity spool while preserving the original error and writable source',
              'SQLite relation audit grouping buckets persisted key values consistently with existing equality and skips nonreflexive decoded keys',
              'SQLite authoritative attribute layout projects a single-field page in one SQL call and patches a scalar without reading or encoding its large neighbors',
              'SQLite authoritative attribute layout projects each lossless kind with ordered duplicates, absent rows and fresh composite ownership',
              'SQLite authoritative attribute layout reopens existing layouts read-only and diagnoses missing or duplicate authoritative values',
              'SQLite structural schema admission accepts the empty maintained-rank map serialized by the current native schema',
              "SQLite structural schema admission refuses 'named rank index' before changing data, layouts, indexes or revision",
              'SQLite graph execution batches a width-16 frontier and closes an early-return cursor before the next write',
              'SQLite graph execution batches a width-256 frontier and closes an early-return cursor before the next write',
              ...['obsolete relation unique','duplicate relation key','invalid relation key name','non-map relation key'].map(name=>`SQLite structural schema admission refuses '${name}' before changing data, layouts, indexes or revision`),
            ]:[])];
            for(const name of required) {
              const found=cases.filter(test=>test.fullName===name);
              assert.equal(found.length,1,`${backend}: missing or duplicated witness: ${name}`);
              assert.equal(found[0].status,'passed',`${backend}: ${name}`);
            }
            const model=report.testResults.filter(file=>file.name.replaceAll('\\','/').endsWith('/tests/engine/model-based.spec.ts')).flatMap(file=>file.assertionResults);
            assert(model.length>=3,`${backend}: model cases must execute`);
            for(const test of model)assert.equal(test.status,'passed',`${backend}: ${test.fullName}`);
            summary.push({backend,required,modelCases:model.map(test=>test.fullName),passed:true});
          }
          writeFileSync('.temp/sqlite-api/relation-model-witnesses.json',JSON.stringify(summary,null,2)+'\n');
          JS
      - name: Record the trusted native vector CPU backend
        if: ${{ !cancelled() && steps.relation_witnesses.outcome == 'success' }}
        run: node native/vectors/runtime-info.mjs .temp/sqlite-api/vector-runtime-info.json
      - name: High-multiplicity audit resources from the built package
        if: ${{ !cancelled() && steps.relation_witnesses.outcome == 'success' }}
        run: |
          set -euo pipefail
          docker build -t ears-audit-runtime - <<'DOCKER'
          FROM ubuntu:24.04
          RUN apt-get update && apt-get install -y --no-install-recommends python3 git libstdc++6 && rm -rf /var/lib/apt/lists/*
          DOCKER
          docker image inspect ears-audit-runtime --format '{{.Id}}' > .temp/sqlite-api/audit-image.txt
          audit_node_binary=$(command -v node)
          docker run --rm --network none --cpus 2 --memory 6g --memory-swap 6g --cap-drop ALL \
            --user "$(id -u):$(id -g)" --workdir /workspace -e PATH=/runtime:/usr/bin:/bin \
            -e GITHUB_SHA="$GITHUB_SHA" -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$audit_node_binary:/runtime/node:ro" -v "$GITHUB_WORKSPACE/.temp/sqlite-api:/results" \
            ears-audit-runtime /runtime/node --experimental-strip-types \
            packages/apack-ears/bench/sqlite/relation-audit-resources.mjs /results/relation-audit-resources.json \
            2>&1 | tee .temp/sqlite-api/relation-audit-resources.log
      - name: Require all declared real-content relevance judgments
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const fixture=JSON.parse(readFileSync('packages/apack-ears/tests/fixtures/real-search-relevance.json','utf8'));
          for(const backend of ['elmdb','sqlite']) {
            const report=JSON.parse(readFileSync(`.temp/sqlite-api/${backend}-contracts.json`,'utf8'));
            const cases=report.testResults.flatMap(file=>file.name.replaceAll('\\','/').endsWith('/tests/engine/real-search-relevance.spec.ts')?file.assertionResults:[]);
            assert.equal(cases.length,fixture.cases.length);
            for(const expected of fixture.cases) assert(cases.some(test=>test.fullName.endsWith(expected.name)&&test.status==='passed'),`${backend}: ${expected.name}`);
          }
          JS
      - name: Build matching producer for copied-profile conversion regression
        if: ${{ !cancelled() }}
        working-directory: vendor/elmdb
        run: cargo build --locked --release -p elmdb-cli
      - name: Copied-profile conversion and host reopen regression
        if: ${{ !cancelled() }}
        env:
          EARS_TEST_SOURCE: ${{ github.sha }}
        run: |
          set -o pipefail
          node scripts/with-source.mjs node --import tsx tests/scripts/test-sqlite-profile-conversion.ts \
            vendor/elmdb/target/release/elmdb .temp/sqlite-api/profile-conversion.json \
            2>&1 | tee .temp/sqlite-api/profile-conversion.log
      - name: Preserve generated reports for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ears-sqlite-api-${{ github.run_id }}
          path: |
            .temp/sqlite-api
            packages/apack-ears/etc
          if-no-files-found: error
          retention-days: 14
  check:
    if: ${{ inputs.suite != 'sqlite' && inputs.suite != 'sqlite-admission' && inputs.suite != 'sqlite-bench' && inputs.suite != 'sqlite-model-windows' && inputs.suite != 'sqlite-api' && inputs.suite != 'sqlite-corpus' && inputs.suite != 'sqlite-relevance' && inputs.suite != 'sqlite-graph-wasm' && inputs.suite != 'sqlite-vector-dispatch' && inputs.suite != 'activation-profile' && inputs.suite != 'windows-durability' && inputs.suite != 'installed-platform' }}
    runs-on: ${{ inputs.suite == 'host-windows' && 'windows-latest' || 'macos-26' }}
    # Includes the cold builds, fork producer, app suites and bounded source-dev scenario.
    timeout-minutes: 45
    env:
      APACK_CHAIN_CORES: 2
      APACK_E2E_REPEAT: ${{ inputs.repeat_each }}
      APACK_STORAGE_FORMAT: ${{ inputs.storage_format || 'elmdb/1' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.1
          cache: npm
      - name: Record source
        run: git rev-parse HEAD
      - name: Validate storage selection
        run: |
          case "$APACK_STORAGE_FORMAT" in
            elmdb/1|sqlite/1) printf 'Isolated app storage: %s\n' "$APACK_STORAGE_FORMAT" ;;
            *) echo 'Expected elmdb/1 or sqlite/1'; exit 1 ;;
          esac
      - name: Validate repetition count
        run: |
          repeat_pattern='^([1-9]|1[0-9]|20)$'
          if [[ ! "$APACK_E2E_REPEAT" =~ $repeat_pattern ]]; then
            echo 'repeat_each must be an integer from 1 to 20'; exit 1
          fi
      - uses: ./.github/actions/elmdb
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Build shipped pack
        if: ${{ inputs.suite != 'host-windows' && !startsWith(inputs.suite, 'installed') }}
        env:
          APACK_ACCEPTANCE_SUITE: ${{ inputs.suite }}
        run: |
          if [[ "$APACK_ACCEPTANCE_SUITE" == 'build' ]]; then
            # Diagnostic only: observe build phase costs without running the application suites.
            mkdir -p .apack/tests/results
            node_modules/.bin/tsx scripts/bounded.ts scenario npm run build:default-setup | tee .apack/tests/results/default-build.log
          else
            npm run build:default-setup
          fi
      - name: Build app runtime
        if: ${{ inputs.suite != 'build' && inputs.suite != 'integration' && inputs.suite != 'host-windows' && !startsWith(inputs.suite, 'installed') }}
        id: runtime
        # The renderer leg's heap ceiling is declared on the leg (RUNTIME_BUILD_LEGS).
        run: npm run build:runtime -- --cores 2
      - name: Build unsigned installed Preview
        if: ${{ startsWith(inputs.suite, 'installed') }}
        run: |
          mkdir -p .apack/installed-evidence
          version="$(node -p 'require("./package.json").version.split("-")[0]')"
          npm run build:preview -- --version "$version" | tee .apack/installed-evidence/installed-build.log
      - name: Typecheck installed app contracts
        if: ${{ startsWith(inputs.suite, 'installed') }}
        run: node node_modules/typescript/bin/tsc -p tests --noEmit | tee .apack/installed-evidence/typecheck.log
      - name: Packaged native runtime
        if: ${{ startsWith(inputs.suite, 'installed') }}
        run: |
          apps=(dist/preview/mac-*/*.app/Contents/Resources/app)
          if (( ${#apps[@]} != 1 )) || [[ ! -d "${apps[0]}" ]]; then
            echo 'Expected one unpacked Preview app'; exit 1
          fi
          node build/prod/smoke-native.mjs "${apps[0]}" | tee .apack/installed-evidence/installed-native.log
      - name: Sign installed Preview and verify native provenance
        if: ${{ inputs.suite == 'installed-signed' }}
        env:
          APACK_TEST_CERTIFICATE: ${{ secrets.certificate || secrets.MAC_CERTIFICATE_P12_BASE64 }}
          APACK_TEST_CERTIFICATE_PASSWORD: ${{ secrets.certificate_password || secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$APACK_TEST_CERTIFICATE"
          umask 077
          keychain="$RUNNER_TEMP/apack-installed-signing.keychain-db"
          certificate="$RUNNER_TEMP/apack-installed-signing.p12"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$APACK_TEST_CERTIFICATE" | base64 --decode > "$certificate"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -P "$APACK_TEST_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          export APACK_TEST_SIGNING_KEYCHAIN="$keychain"
          node --input-type=module <<'JS' | tee .apack/installed-evidence/installed-signing.log
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { signMacApplication } from './scripts/lib/native-signing.mjs';
          const apps=fs.readdirSync('dist/preview',{withFileTypes:true}).filter(d=>d.isDirectory()&&d.name.startsWith('mac-'))
            .flatMap(d=>fs.readdirSync(path.join('dist/preview',d.name)).filter(n=>n.endsWith('.app')).map(n=>path.resolve('dist/preview',d.name,n)));
          assert.equal(apps.length,1);
          const app=apps[0],keychain=process.env.APACK_TEST_SIGNING_KEYCHAIN;
          const search=execFileSync('security',['list-keychains','-d','user'],{encoding:'utf8'})
            .trim().split('\n').map(n=>n.trim().replace(/^"|"$/g,'')).filter(Boolean);
          execFileSync('security',['list-keychains','-d','user','-s',keychain,...search]);
          const identities=execFileSync('security',['find-identity','-v','-p','codesigning',keychain],{encoding:'utf8'});
          const matches=[...identities.matchAll(/\b([A-F0-9]{40}) "Developer ID Application:[^"\n]+"/g)];
          assert.equal(matches.length,1,'Expected one Developer ID Application identity');
          const entitlements=path.resolve('build/resources/entitlements.mac.plist');
          await signMacApplication({app,identity:matches[0][1],identityValidation:false,keychain,platform:'darwin',
            strictVerify:true,preAutoEntitlements:false,preEmbedProvisioningProfile:false,
            optionsForFile:()=>({entitlements,hardenedRuntime:true,timestamp:'none'})});
          execFileSync('codesign',['--verify','--deep','--strict',app],{stdio:'inherit'});
          const executable=path.join(app,'Contents/MacOS',fs.readdirSync(path.join(app,'Contents/MacOS'))[0]);
          const details=spawnSync('codesign',['--display','--verbose=4',executable],{encoding:'utf8'});
          assert.equal(details.status,0);assert.match(details.stderr,/flags=.*\bruntime\b/);
          assert.match(details.stderr,/TeamIdentifier=[A-Z0-9]{10}\b/);console.log(details.stderr);
          JS
          apps=(dist/preview/mac-*/*.app/Contents/Resources/app)
          node build/prod/smoke-native.mjs "${apps[0]}" | tee .apack/installed-evidence/installed-signed-native.log
      - name: Installed SQLite app lifecycle
        if: ${{ startsWith(inputs.suite, 'installed') }}
        env:
          APACK_STORAGE_FORMAT: sqlite/1
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.apack/installed-evidence/installed-app.json
        run: |
          apps=(dist/preview/mac-*/*.app/Contents/Resources/app)
          executables=("${apps[0]}"/../../MacOS/*)
          if (( ${#executables[@]} != 1 )) || [[ ! -x "${executables[0]}" ]]; then
            echo 'Expected one packaged Preview executable'; exit 1
          fi
          unset APACK_HOST_ROOT
          export APACK_HOST_EXECUTABLE="${executables[0]}"
          node scripts/with-source.mjs node_modules/.bin/playwright test tests/e2e/smoke tests/e2e/app-integration/sqlite-storage.spec.ts --workers 1 --reporter=line,json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const report=JSON.parse(fs.readFileSync(process.env.PLAYWRIGHT_JSON_OUTPUT_NAME,'utf8'));
          const specs=suites=>suites.flatMap(s=>[...(s.specs??[]),...specs(s.suites??[])]);
          const witness=specs(report.suites).find(s=>s.title==='packaged SQLite stores hold their model claims across the real API process');
          assert(witness?.ok&&witness.tests.every(t=>t.results.some(r=>r.status==='passed')),'Actual packaged SQLite witness must execute');
          assert(report.stats.expected>=6&&report.stats.unexpected===0&&report.stats.skipped===0&&report.stats.flaky===0,'Installed app checks must pass without skips or retries');
          fs.writeFileSync('.apack/installed-evidence/verification.json',JSON.stringify({stats:report.stats,sqliteWitness:witness.title},null,2)+'\n');
          NODE
      - name: Host contract dependencies
        if: ${{ inputs.suite == 'host-windows' }}
        run: npm run packages:build
      - name: Focused Windows ownership and recovery
        if: ${{ inputs.suite == 'host-windows' }}
        env:
          EARS_EVALUATION_BACKEND: sqlite
        run: |
          node -e "require('node:fs').mkdirSync('.apack/tests/results',{recursive:true})"
          npm test -w @apackdev/host -- tests/database/write-lock.spec.ts tests/backup/recovery.spec.ts --maxWorkers 2 --reporter=default --reporter=json --outputFile=../../.apack/tests/results/host-windows.json
      - name: Runtime smoke
        if: ${{ inputs.suite == 'packaged' }}
        run: npm run test:smoke
      - name: Packaged authoring producer
        if: ${{ inputs.suite == 'packaged' }}
        run: npm run test:packaged-authoring:author
      - name: Packaged authoring app consumer
        if: ${{ inputs.suite == 'packaged' }}
        run: npm run test:packaged-authoring:app
      - name: Build fixture contracts
        id: preparation
        if: ${{ inputs.suite == 'all' || inputs.suite == 'external' || inputs.suite == 'bundled-ui' || inputs.suite == 'cli' || inputs.suite == 'integration' }}
        run: npm run test:external-pack:contract
      - name: Selected integration files
        if: ${{ inputs.suite == 'integration' }}
        env:
          APACK_INTEGRATION_FILES: ${{ inputs.test }}
        run: |
          read -r -a files <<< "$APACK_INTEGRATION_FILES"
          if (( ${#files[@]} == 0 )); then echo 'Name explicit integration or native spec files'; exit 1; fi
          integration=(); native=()
          for file in "${files[@]}"; do
            if [[ ! -f "$file" ]]; then echo "No such spec: $file"; exit 1
            elif [[ "$file" == packages/*/*.integration.spec.ts ]]; then integration+=("$file")
            elif [[ "$file" == packages/*/*.native.spec.ts ]]; then native+=("$file")
            else echo "Not an integration or native spec: $file"; exit 1
            fi
          done
          mkdir -p .apack/tests/results
          # Each half runs under its own root config, which is what includes its files. The native half's live
          # watchers run one at a time, as the strict gate's native job runs them: two at once on this runner
          # starve each other's rebuild deadlines
          run() {
            node scripts/with-source.mjs node node_modules/vitest/vitest.mjs run --config "vitest.$1.config.ts" "${@:3}" --poolOptions.threads.maxThreads=$2 --poolOptions.threads.minThreads=1 --poolOptions.forks.maxForks=$2 --poolOptions.forks.minForks=1 --bail=1 --reporter=default --reporter=json --outputFile=".apack/tests/results/$1.json"
          }
          if (( ${#integration[@]} )); then run integration 2 "${integration[@]}"; fi
          if (( ${#native[@]} )); then run native 1 "${native[@]}"; fi
      - name: Prepare external default fork
        if: ${{ inputs.suite == 'all' || inputs.suite == 'external' }}
        run: npm run test:external-pack:fork
      - name: Selected external pack app suite
        if: ${{ inputs.suite == 'all' || inputs.suite == 'external' || inputs.suite == 'bundled-ui' }}
        working-directory: ${{ inputs.suite == 'bundled-ui' && 'tests/packs/bundled-ui-pack' || 'tests/packs/external-pack' }}
        env:
          APACK_E2E_GREP: ${{ inputs.test }}
        run: |
          args=(--host "$GITHUB_WORKSPACE" --prebuilt --trace retain-on-failure --repeat-each "$APACK_E2E_REPEAT")
          if [[ -n "$APACK_E2E_GREP" ]]; then args+=(--grep "$APACK_E2E_GREP"); fi
          ../../../node_modules/.bin/apack pack test "${args[@]}"
      - name: Source app test types and settings harness lint
        if: ${{ inputs.suite == 'app' }}
        run: |
          node_modules/.bin/oxlint tests/e2e/ui/host-settings.spec.ts -D correctness
          node_modules/.bin/tsc -p tests --noEmit --incremental false
      - name: App suites including settings recovery
        if: ${{ !cancelled() && (inputs.suite == 'all' || inputs.suite == 'app') && steps.runtime.outcome == 'success' }}
        env:
          APACK_E2E_GREP: ${{ inputs.test }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.apack/tests/results/source-app.json
        run: |
          args=(--repeat-each "$APACK_E2E_REPEAT")
          if [[ -n "$APACK_E2E_GREP" ]]; then args+=(--grep "$APACK_E2E_GREP"); fi
          npm run test:e2e -- "${args[@]}" --reporter=line,json
      - name: Retain app suites before the CLI scenario
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-${{ github.sha }}-suites
          include-hidden-files: true
          path: |
            .apack/tests/results/
            .apack/installed-evidence/
            tests/packs/*/.apack/tests/results/
            tests/packs/*/dist/build-inputs.json
      - name: Compiler queue lifecycle
        if: ${{ inputs.suite == 'cli' }}
        run: node scripts/with-source.mjs node node_modules/vitest/vitest.mjs run --project @apackdev/cli packages/apack-cli/tests/build/pack-builder.spec.ts --maxWorkers 2
      - name: Source pack dev install and rebuild
        if: ${{ !cancelled() && (inputs.suite == 'all' || inputs.suite == 'cli') && steps.preparation.outcome == 'success' }}
        run: node scripts/with-source.mjs tsx tests/scripts/test-pack-dev.ts
      - name: Real LMDB import and rollback
        if: ${{ !cancelled() && inputs.suite == 'all' && steps.preparation.outcome == 'success' }}
        working-directory: packages/apack-host
        run: node ../../scripts/with-source.mjs node ../../node_modules/vitest/vitest.mjs run tests/backup/import.spec.ts --maxWorkers 2
      - name: Retain app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-acceptance-${{ github.sha }}
          include-hidden-files: true
          path: |
            .apack/tests/results/
            .apack/installed-evidence/
            tests/packs/*/.apack/tests/results/
            tests/packs/*/dist/build-inputs.json
      - name: Remove installed signing keychain
        if: ${{ always() && inputs.suite == 'installed-signed' }}
        run: |
          security delete-keychain "$RUNNER_TEMP/apack-installed-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/apack-installed-signing.p12"

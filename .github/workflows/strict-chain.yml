name: Strict chain

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Shared SDK/engine contracts use SQLite. Boot selection belongs to isolated app-launch steps;
# unit/integration fixtures also exercise explicit native stores and default-profile refusals.
# Native extension-specific coverage additionally runs in ears-sqlite.yml on all supported hosts.
env:
  EARS_EVALUATION_BACKEND: sqlite

concurrency:
  group: strict-chain-${{ github.ref }}
  cancel-in-progress: false

# The strict chain as parallel jobs. `npm run chain -- --job <name>` derives each job's steps from the chain
# graph (`scripts/lib/chain-only.ts`): `producers` runs what the expensive pools read, then the integration
# and native shards, and the app half with the remaining checks, run beside each other on its outputs. Each consumer
# refuses unless the producers' outputs and stamps it downloaded are current, so no job can pass over
# missing preparation.
jobs:
  producers:
    runs-on: macos-26
    # The cold shipped-pack build, fixture contracts and the typecheck legs
    timeout-minutes: 45
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-runtime
        with:
          node-version: 23.11.1
      - name: Record source and platform
        run: |
          git rev-parse HEAD
          sw_vers
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})'
      - uses: ./.github/actions/elmdb
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Producers
        run: npm run chain -- --strict --all --cores 2 --job producers | tee "$RUNNER_TEMP/strict-chain.log"
      # A tarball keeps file modes and symlinks, which the stamps and the CLI bundle depend on. Times need not
      # survive: a build records a file's content where a compiler read its modification time
      - name: Package producer outputs
        run: |
          node scripts/with-source.mjs npx tsx scripts/strict-job-artifact.ts > "$RUNNER_TEMP/producers.list"
          tar -czf "$RUNNER_TEMP/producers.tgz" -T "$RUNNER_TEMP/producers.list"
      - name: Hand producer outputs on
        uses: actions/upload-artifact@v4
        with:
          name: strict-producers-${{ github.sha }}
          path: ${{ runner.temp }}/producers.tgz
          retention-days: 1
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-chain-${{ github.sha }}-producers
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/strict-chain.log
            node_modules/.cache/apack-chain/runs/

  consumers:
    needs: producers
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          # Five, because a free account runs at most five macOS jobs at once: a sixth waits for one of these
          # to finish and pays its own setup on top, so more shards lengthen the gate rather than shorten it
          - { job: integration, shard: '1/2', name: integration-1 }
          - { job: integration, shard: '2/2', name: integration-2 }
          - { job: native, shard: '1/2', name: native-1 }
          - { job: native, shard: '2/2', name: native-2 }
          - { job: 'app,rest', shard: '', name: app-and-rest }
    name: ${{ matrix.name }}
    timeout-minutes: 60
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-runtime
        with:
          node-version: 23.11.1
      - name: Record source
        run: git rev-parse HEAD
      - uses: ./.github/actions/elmdb
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci
      - name: Receive producer outputs
        uses: actions/download-artifact@v4
        with:
          name: strict-producers-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Unpack producer outputs
        run: tar -xzf "$RUNNER_TEMP/producers.tgz"
      - name: ${{ matrix.name }}
        env:
          APACK_STRICT_JOB: ${{ matrix.job }}
          APACK_STRICT_SHARD: ${{ matrix.shard }}
          SPEC_DURATIONS_PROGRESS_FILE: ${{ runner.temp }}/strict-spec-progress
        run: |
          args=(--strict --all --cores 2 --job "$APACK_STRICT_JOB")
          if [[ -n "$APACK_STRICT_SHARD" ]]; then args+=(--shard "$APACK_STRICT_SHARD"); fi
          npm run chain -- "${args[@]}" | tee "$RUNNER_TEMP/strict-chain.log"
      - name: Isolated source SQLite app smoke and storage witness
        # This independent witness must still run after a contract failure; that failed step retains job failure.
        if: ${{ !cancelled() && matrix.name == 'app-and-rest' }}
        env:
          APACK_STORAGE_FORMAT: sqlite/1
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/.apack/tests/results/strict-sqlite-app.json
        run: |
          node scripts/with-source.mjs playwright test tests/e2e/smoke tests/e2e/app-integration/sqlite-source-storage.spec.ts --workers=1 --retries=0 --reporter=line,json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('.apack/tests/results/strict-sqlite-app.json', 'utf8'));
          assert.equal(result.stats.expected, 6);
          for (const key of ['skipped', 'unexpected', 'flaky']) assert.equal(result.stats[key], 0);
          const specs = suite => [...(suite.specs ?? []), ...(suite.suites ?? []).flatMap(specs)];
          const actual = specs(result);
          assert(actual.some(spec => spec.title === 'source SQLite app opens both managed stores with persisted EARS identity'));
          for (const spec of actual) for (const test of spec.tests) {
            assert.equal(test.results.length, 1);
            assert.equal(test.results[0].status, 'passed');
            assert.equal(test.results[0].retry, 0);
          }
          JS
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-chain-${{ github.sha }}-${{ matrix.name }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/strict-chain.log
            ${{ runner.temp }}/strict-spec-progress.*.jsonl
            node_modules/.cache/apack-chain/runs/
            .apack/tests/results/
            tests/packs/*/.apack/tests/results/

  sqlite-candidate:
    permissions:
      contents: read
    uses: ./.github/workflows/ears-sqlite.yml

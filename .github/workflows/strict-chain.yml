name: Strict chain

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: strict-chain-${{ github.ref }}
  cancel-in-progress: false

# The strict chain as parallel jobs. `npm run chain -- --job <name>` derives each job's steps from the chain
# graph (`scripts/lib/chain-only.ts`): `producers` runs what the expensive pools read, then the integration
# and native shards, and the app half with the remaining checks, run beside each other on its outputs. Each consumer
# refuses unless the producers' outputs and stamps it downloaded are current, so no job can pass over
# missing preparation.
jobs:
  producers:
    runs-on: macos-26
    # The cold shipped-pack build, fixture contracts and the typecheck legs
    timeout-minutes: 45
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install pinned npm
        run: npm install -g npm@11.21.1
      - name: Record source and platform
        run: |
          git rev-parse HEAD
          sw_vers
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,versions:process.versions})'
      - uses: ./.github/actions/elmdb
      - uses: ./.github/actions/apack-terminal
        with:
          build: 'true'
      - uses: ./.github/actions/apack-terminal-view
      # **Electron's binary is cached, so most runs never ask the CDN for it.** It comes from GitHub's release
      # CDN, whose 504 failed a strict job inside `scripts/postinstall.mjs` on 2026-11-08 — before any of this
      # repo's code ran. The retry there is what makes a refusal survivable; this is what makes it rare. Keyed
      # on the runner and the locked version, so a bump fetches once and every later job restores it.
      - name: Cache Electron's binary
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # **Every strict job installs identically, and that is not a preference.** A pack records its package
        # graph in `dist/build-inputs.json`, and `tests/packs/external-pack`'s graph includes
        # `node_modules/electron` — so `readPackageInputs` hashes that package's files. `producers` builds the
        # pack and the consumers unpack and test it, which means an install that differs between them changes
        # the hash and every case refuses with *"Pack build package inputs changed; rebuild the complete
        # pack"*. Skipping the download here did exactly that on 2026-11-08 (run 42472092232, app-and-rest).
        # `ELECTRON_SKIP_BINARY_DOWNLOAD` is therefore only safe where one job builds and consumes its own
        # pack, which is `ci.yml`'s `check`.
        run: npm ci
      - name: Producers
        run: npm run chain -- --strict --all --cores 2 --job producers | tee "$RUNNER_TEMP/strict-chain.log"
      # A tarball keeps file modes and symlinks, which the stamps and the CLI bundle depend on. Times need not
      # survive: a build records a file's content where a compiler read its modification time
      - name: Package producer outputs
        run: |
          node scripts/with-source.mjs npx tsx scripts/strict-job-artifact.ts > "$RUNNER_TEMP/producers.list"
          tar -czf "$RUNNER_TEMP/producers.tgz" -T "$RUNNER_TEMP/producers.list"
      - name: Hand producer outputs on
        uses: actions/upload-artifact@v4
        with:
          name: strict-producers-${{ github.sha }}
          path: ${{ runner.temp }}/producers.tgz
          retention-days: 1
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-chain-${{ github.sha }}-producers
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/strict-chain.log
            node_modules/.cache/apack-chain/runs/

  consumers:
    needs: producers
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          # Five, because a free account runs at most five macOS jobs at once: a sixth waits for one of these
          # to finish and pays its own setup on top, so more shards lengthen the gate rather than shorten it
          - { job: integration, shard: '1/2', name: integration-1 }
          - { job: integration, shard: '2/2', name: integration-2 }
          - { job: native, shard: '1/2', name: native-1 }
          - { job: native, shard: '2/2', name: native-2 }
          - { job: 'app,rest', shard: '', name: app-and-rest }
    name: ${{ matrix.name }}
    timeout-minutes: 60
    env:
      APACK_CHAIN_CORES: 2
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install pinned npm
        run: npm install -g npm@11.21.1
      - name: Record source
        run: git rev-parse HEAD
      - uses: ./.github/actions/elmdb
      - uses: ./.github/actions/apack-terminal
        with:
          build: 'true'
      - uses: ./.github/actions/apack-terminal-view
      # **Electron's binary is cached, so most runs never ask the CDN for it.** It comes from GitHub's release
      # CDN, whose 504 failed a strict job inside `scripts/postinstall.mjs` on 2026-11-08 — before any of this
      # repo's code ran. The retry there is what makes a refusal survivable; this is what makes it rare. Keyed
      # on the runner and the locked version, so a bump fetches once and every later job restores it.
      - name: Cache Electron's binary
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # **Every strict job installs identically, and that is not a preference.** A pack records its package
        # graph in `dist/build-inputs.json`, and `tests/packs/external-pack`'s graph includes
        # `node_modules/electron` — so `readPackageInputs` hashes that package's files. `producers` builds the
        # pack and the consumers unpack and test it, which means an install that differs between them changes
        # the hash and every case refuses with *"Pack build package inputs changed; rebuild the complete
        # pack"*. Skipping the download here did exactly that on 2026-11-08 (run 42472092232, app-and-rest).
        # `ELECTRON_SKIP_BINARY_DOWNLOAD` is therefore only safe where one job builds and consumes its own
        # pack, which is `ci.yml`'s `check`.
        run: npm ci
      - name: Receive producer outputs
        uses: actions/download-artifact@v4
        with:
          name: strict-producers-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Unpack producer outputs
        run: tar -xzf "$RUNNER_TEMP/producers.tgz"
      - name: ${{ matrix.name }}
        env:
          APACK_STRICT_JOB: ${{ matrix.job }}
          APACK_STRICT_SHARD: ${{ matrix.shard }}
          SPEC_DURATIONS_PROGRESS_FILE: ${{ runner.temp }}/strict-spec-progress
        run: |
          args=(--strict --all --cores 2 --job "$APACK_STRICT_JOB")
          if [[ -n "$APACK_STRICT_SHARD" ]]; then args+=(--shard "$APACK_STRICT_SHARD"); fi
          npm run chain -- "${args[@]}" | tee "$RUNNER_TEMP/strict-chain.log"
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-chain-${{ github.sha }}-${{ matrix.name }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/strict-chain.log
            ${{ runner.temp }}/strict-spec-progress.*.jsonl
            node_modules/.cache/apack-chain/runs/

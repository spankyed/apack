name: Publish packages

# Versions @apackdev/ears, @apackdev/sdk, @apackdev/ui, @apackdev/cli and @apackdev/testing with Changesets and
# publishes the built copies to npm with provenance. Until publishing is switched on, every run is a dry
# run: it opens/updates the "Version packages" PR and runs `npm publish --dry-run`.
#
# **Do not rename this file once trusted publishing is configured.** npm matches a trusted publisher on
# `owner/repo` plus this workflow's path, so a rename revokes publish rights for every package and the
# failure is a 403 that names neither the file nor the reason. Renaming it means re-configuring each
# package on npmjs.com first.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (otherwise dry run)
        type: boolean
        default: false
  # push:
  #   branches: [master]

concurrency:
  group: publish-packages
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: ./.github/actions/elmdb

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # **Refused before the build, not at the push.** A real publish needs a credential and this repo has
      # none: `NPM_TOKEN` is set at no scope, so without this the run spends twenty minutes on `api:check`,
      # `packages:build` and `packages:check` and then fails inside Changesets, where the message is about
      # npm auth rather than about what to set up. The dry run needs nothing and is left alone.
      #
      # **OIDC first, a token as the fallback, which is what makes switching it on a switch.** `id-token:
      # write` above is what npm exchanges for publish rights, so trusted publishing needs no standing
      # credential to rotate or leak — and this step must not block the day it is configured. The probe is
      # `ACTIONS_ID_TOKEN_REQUEST_URL`, which Actions sets only when that permission is granted.
      #
      # **That arm is unreachable until a package has a trusted publisher**, so nothing exercises it yet. The
      # edit that does is configuring one on npmjs.com; until then the token arm is the live one and this
      # ordering is what stops the step being the thing that has to change at the same time.
      - name: Refuse a publish with no credential
        if: inputs.publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "Publishing over OIDC (trusted publishing); no npm token is needed or used."
            exit 0
          fi
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing with NODE_AUTH_TOKEN from secrets.NPM_TOKEN."
            echo "::notice title=Standing npm credential::This used a token. Trusted publishing (OIDC) needs none — see this workflow's header."
            exit 0
          fi
          echo "::error title=No npm credential::A publish was asked for and nothing can authenticate it."
          cat <<'WHY'
          Nothing is configured to publish to npm, and none of these packages is on the registry yet.

          The end state is trusted publishing (OIDC): this workflow already requests `id-token: write`,
          so npm exchanges GitHub's token for publish rights and there is no standing credential to
          rotate or leak. It is configured per package on npmjs.com, which needs the package to exist —
          so the first publish is bootstrapped with one short-lived granular token, set as NPM_TOKEN,
          and revoked the same day.

          Re-run with `publish: false` for a dry run, which needs no credential and exercises everything
          above this step.

          Before switching it on: publishing creates consumers outside this repo, which is the condition
          the root CLAUDE.md's "Backward compatibility" section says to revisit. That is a deliberate
          decision, not a side effect of running this workflow.
          WHY
          exit 1

      - name: Check the published API surface
        run: npm run api:check --workspace @apackdev/ears --workspace @apackdev/sdk --workspace @apackdev/ui

      - name: Build publishable packages
        run: npm run packages:build

      - name: Validate packed packages
        run: npm run packages:check

      - name: Version PR or publish
        uses: changesets/action@v1
        with:
          title: 'chore: version packages'
          commit: 'chore: version packages'
          version: npm run packages:version
          publish: npm run packages:publish -- ${{ !inputs.publish && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

name: Build macOS (Signed + Notarized)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel (production or beta)'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - beta

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# What builds reads the repository and nothing more. The one job whose token writes is the release job, which runs
# gh over the files the build job kept and no code from the checkout or its dependencies
permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-26 # Apple Silicon runner
    timeout-minutes: 30
    outputs:
      is_beta: ${{ steps.channel.outputs.is_beta }}
      product_name: ${{ steps.channel.outputs.product_name }}
      release_prefix: ${{ steps.channel.outputs.release_prefix }}

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.2
          cache: npm
      - name: Install pinned npm
        run: npm install -g npm@11.21.1

      - uses: ./.github/actions/elmdb
      - uses: ./.github/actions/apack-terminal
      - uses: ./.github/actions/apack-git

      # A tag names its channel, and the `channel` input is read for a branch alone: a tag's files go into its
      # release, where a beta build dispatched on a production tag would put apack Beta's files
      - name: Detect channel
        id: channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            CHANNEL=production
            if [[ "$TAG_VERSION" == *-beta* ]]; then CHANNEL=beta; fi
          fi
          if [ "$CHANNEL" = beta ]; then
            printf '%s\n' is_beta=true 'product_name=apack Beta' release_prefix=apack-Beta >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' is_beta=false product_name=apack release_prefix=apack >> "$GITHUB_OUTPUT"
          fi
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${{ steps.channel.outputs.tag_version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          # release.sh tags v<version>-beta.0 on a production release that had no beta
          # (beta-before-production rule); that tag builds the same version as apack Beta
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] && [ "$TAG_VERSION" != "${PKG_VERSION}-beta.0" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      # A tag's release must be signed and notarized: every secret it takes is there before the build starts
      - name: Signing secrets are configured
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in CERTIFICATE CERTIFICATE_PASSWORD TEAM_ID API_KEY API_KEY_ID API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::A release must be signed and notarized, and these secrets are empty: ${missing[*]}"
            exit 1
          fi

      # The install runs every dependency's install script, so it is a step of its own that holds no signing secret.
      # @vscode/ripgrep's postinstall reads the GitHub API, where a shared runner address without a token is over the
      # rate limit; this job's token reads this repository and writes nothing
      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      # The signing secrets reach this step alone, as environment variables, never as script text. electron-builder
      # fails on a signing variable that is set and empty, so each is exported only when its secret is configured
      - name: Build, package, sign
        env:
          APACK_DEPENDENCIES_INSTALLED: '1'
          CERTIFICATE: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            export CSC_LINK="$CERTIFICATE"
            export CSC_KEY_PASSWORD="$CERTIFICATE_PASSWORD"
          fi
          if [ -n "$TEAM_ID" ]; then
            # notarytool reads the API key from a file
            (umask 077 && printf '%s\n' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8")
            export APPLE_TEAM_ID="$TEAM_ID"
            export APPLE_API_KEY_ID="$API_KEY_ID"
            export APPLE_API_ISSUER="$API_ISSUER"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          fi
          args=()
          if [ "${{ steps.channel.outputs.is_beta }}" = "true" ]; then
            args=(-- --beta)
          fi
          npm run build:production "${args[@]}"

      # A tag's app is published, so it must be signed, notarized and stapled, or the release doesn't go out; a
      # dispatch from a branch may build unsigned, and only reports
      - name: Verify signing
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          APP_NAME="${{ steps.channel.outputs.product_name }}"
          codesign --verify --deep --strict "dist/mac-arm64/${APP_NAME}.app"
          xcrun stapler validate "dist/mac-arm64/${APP_NAME}.app"
          spctl --assess --type exec --verbose "dist/mac-arm64/${APP_NAME}.app"

      # `apack pack test --channel beta` verifies downloads against these
      - name: Checksums
        working-directory: dist
        run: |
          # electron-builder.mjs artifactName: the product name without spaces
          for file in "${{ steps.channel.outputs.release_prefix }}"-*.dmg "${{ steps.channel.outputs.release_prefix }}"-*.zip; do
            shasum -a 256 "$file" > "$file.sha256"
          done

      # What the release job uploads on a tag, and what a dispatch leaves for whoever dispatched it
      - name: Keep the release files
        uses: actions/upload-artifact@v6
        with:
          name: mac-${{ steps.channel.outputs.release_prefix }}
          path: |
            dist/${{ steps.channel.outputs.release_prefix }}-*.dmg
            dist/${{ steps.channel.outputs.release_prefix }}-*.zip
            dist/${{ steps.channel.outputs.release_prefix }}-*.sha256
            dist/${{ steps.channel.outputs.release_prefix }}-*.cdx.json
          if-no-files-found: error
          compression-level: 0

  # The one job whose token writes. It runs for a dispatch from a branch too, where it stops after reading the files
  # the build kept, so the hand-over between the two jobs is exercised without a tag
  release:
    needs: build-mac
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      APP_NAME: ${{ needs.build-mac.outputs.product_name }}
      PREFIX: ${{ needs.build-mac.outputs.release_prefix }}
      IS_BETA: ${{ needs.build-mac.outputs.is_beta }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: mac-${{ needs.build-mac.outputs.release_prefix }}
          path: dist

      - name: The files to release
        run: |
          ls -l dist
          cd dist
          shasum -a 256 -c "${PREFIX}"-*.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PRERELEASE_FLAG=""
          if [ "$IS_BETA" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          assets=(dist/"${PREFIX}"-*.dmg dist/"${PREFIX}"-*.zip dist/"${PREFIX}"-*.sha256 dist/"${PREFIX}"-*.cdx.json)

          # A release that can't be read is not one that isn't there: only gh's `release not found` counts as none, since
          # creating one beside a release that exists would make a second draft for the tag, holding this platform's files
          release_exists() {
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2> view.err; then return 0; fi
            if grep -q 'release not found' view.err; then return 1; fi
            cat view.err
            exit 1
          }
          # The Windows and Linux workflows create the tag's release as a draft when they finish first; it is published
          # here, once the files `apack install` and `upgrade` read are on it
          if release_exists; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              --title "${APP_NAME} $GITHUB_REF_NAME" \
              $PRERELEASE_FLAG \
              "${assets[@]}" || {
                status=$?
                if release_exists; then
                  gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
                  gh release edit "$GITHUB_REF_NAME" --draft=false
                else
                  exit "$status"
                fi
              }
          fi

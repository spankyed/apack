name: Build macOS (Signed + Notarized)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 0.1.0). Leave empty to use package.json version.'
        required: false
        type: string
      channel:
        description: 'Build channel (production or beta)'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - beta

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14 # Apple Silicon runner
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm

      - uses: ./.github/actions/elmdb

      - name: Detect channel
        id: channel
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$TAG_VERSION" == *-beta* ]] || [[ "${{ inputs.channel }}" == "beta" ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
            echo "product_name=apack Beta" >> "$GITHUB_OUTPUT"
            echo "release_prefix=apack-Beta" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            echo "product_name=apack" >> "$GITHUB_OUTPUT"
            echo "release_prefix=apack" >> "$GITHUB_OUTPUT"
          fi
          echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${{ steps.channel.outputs.tag_version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PKG_VERSION"
          # release.sh tags v<version>-beta.0 on a production release that had no beta
          # (beta-before-production rule); that tag builds the same version as apack Beta
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] && [ "$TAG_VERSION" != "${PKG_VERSION}-beta.0" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Write notarization API key to file
        if: env.APPLE_API_KEY != ''
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          echo "$APPLE_API_KEY" > /tmp/AuthKey.p8
          chmod 600 /tmp/AuthKey.p8

      - name: Build, package, sign
        env:
          # @vscode/ripgrep downloads from GitHub API during postinstall;
          # without auth the shared CI runner IP hits the 60 req/hr rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Only export signing env vars if secrets are configured
          # (empty strings cause electron-builder to fail)
          if [ -n "${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}" ]; then
            export CSC_LINK="${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}"
            export CSC_KEY_PASSWORD="${{ secrets.MAC_CERTIFICATE_PASSWORD }}"
          fi
          if [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
            export APPLE_API_KEY_ID="${{ secrets.APPLE_API_KEY_ID }}"
            export APPLE_API_ISSUER="${{ secrets.APPLE_API_ISSUER }}"
            export APPLE_API_KEY="/tmp/AuthKey.p8"
          fi
          BETA_FLAG=""
          if [ "${{ steps.channel.outputs.is_beta }}" = "true" ]; then
            BETA_FLAG="-- --beta"
          fi
          npm run build:production $BETA_FLAG

      - name: Verify signing
        continue-on-error: true
        run: |
          APP_NAME="${{ steps.channel.outputs.product_name }}"
          codesign --verify --deep --strict "dist/mac-arm64/${APP_NAME}.app"
          xcrun stapler validate "dist/mac-arm64/${APP_NAME}.app"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APP_NAME="${{ steps.channel.outputs.product_name }}"
          PRERELEASE_FLAG=""
          if [ "${{ steps.channel.outputs.is_beta }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # `apack pack test --channel beta` verifies downloads against these
          # electron-builder.mjs artifactName: the product name without spaces
          PREFIX="${{ steps.channel.outputs.release_prefix }}"
          for file in dist/"${PREFIX}"-*.dmg dist/"${PREFIX}"-*.zip; do
            (cd dist && shasum -a 256 "$(basename "$file")" > "$(basename "$file").sha256")
          done
          assets=(dist/"${PREFIX}"-*.dmg dist/"${PREFIX}"-*.zip dist/"${PREFIX}"-*.sha256)

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --generate-notes \
              --title "${APP_NAME} $GITHUB_REF_NAME" \
              $PRERELEASE_FLAG \
              "${assets[@]}" || {
                status=$?
                if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
                  gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
                else
                  exit "$status"
                fi
              }
          fi

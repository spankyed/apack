# apack-terminal-view at the commit apack pins (vendor/apack-terminal-view.rev), cloned into
# vendor/apack-terminal-view and built, before `npm ci` resolves the built-in pack's `file:` dependency through
# it. Locally that path is a link to a checkout (`npm run link:apack-terminal-view`, which builds it); CI can't
# reach one, so it fetches the pinned commit.
#
# **Always built, unlike the broker beside it.** What a consumer bundles is the package's `dist/`, which is not
# tracked, and the built-in pack is built by nearly every job — so there is no job that needs the clone and not
# the build. It is TypeScript and a few seconds.
name: apack-terminal-view
description: Clone apack-terminal-view at the pinned commit into vendor/apack-terminal-view, and build it
runs:
  using: composite
  steps:
    - name: Clone apack-terminal-view at the pinned commit
      shell: bash
      run: |
        rev=$(tr -d '[:space:]' < vendor/apack-terminal-view.rev)
        git init -q vendor/apack-terminal-view
        git -C vendor/apack-terminal-view fetch -q --depth 1 https://github.com/spankyed/apack-terminal-view.git "$rev"
        git -C vendor/apack-terminal-view checkout -q FETCH_HEAD
    - name: Build what the package ships
      shell: bash
      working-directory: vendor/apack-terminal-view
      run: |
        npm ci --no-audit --no-fund
        npm run build
